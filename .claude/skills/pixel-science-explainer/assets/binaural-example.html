<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Binaural Beats 8-Bit</title>
<style>
  html,body{margin:0;height:100%;background:#05060f;color:#6a70b0;font:12px monospace}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center}
  canvas{height:min(92vh,calc(100vw*16/9));aspect-ratio:9/16;image-rendering:pixelated;cursor:pointer;background:#0d1024}
  p{margin:6px 16px 0;text-align:center}
</style>
</head>
<body>
<canvas id="c" width="180" height="320"></canvas>
<p>click / space: play-pause &middot; m: mute &middot; headphones required &middot; ?l=100&amp;r=105 sets the tones</p>
<script>
(() => {
'use strict';

// ---------- config ----------
const q = new URLSearchParams(location.search);
const freq = (v, d) => { const n = parseFloat(v); return n >= 20 && n <= 1000 ? n : d; };
const FL = freq(q.get('l'), 100);
const FR = freq(q.get('r'), 105);
const BEAT = Math.abs(FR - FL);
const DEBUG_T = q.has('t') ? parseFloat(q.get('t')) : null; // freeze visuals at t seconds (no audio)

const W = 180, H = 320;
const SLOW = 0.03;                 // display slow-down: 100 Hz is drawn moving at 3 cycles/s
const DUR = [5, 8, 8, 8, 6];       // title, ears, compare, brain, outro
const LOOP = DUR.reduce((a, b) => a + b, 0);

const P = {
  bg: '#0d1024', grid: '#171b3d', panel: '#1b1f45', edge: '#3b3f7a', dim: '#8a8fc7',
  fg: '#f4f1de', L: '#3ddcf0', R: '#ff7a59', sum: '#ffd23f', shadow: '#05060f',
  skin: '#d9a273', hair: '#4a2f2a', hairL: '#7a5040', shirt: '#3b3f7a',
  band: '#cfd2e8', brain1: '#a84f78', brain2: '#e87aa0', fold: '#6b2a4a',
};

// ---------- canvas + gfx helpers ----------
const cv = document.getElementById('c');
const cx = cv.getContext('2d');
cx.imageSmoothingEnabled = false;

// 3x5 pixel font, rows top to bottom
const FONT = {
  A:'010 101 111 101 101', B:'110 101 110 101 110', C:'011 100 100 100 011', D:'110 101 101 101 110',
  E:'111 100 110 100 111', F:'111 100 110 100 100', G:'011 100 101 101 011', H:'101 101 111 101 101',
  I:'111 010 010 010 111', J:'001 001 001 101 010', K:'101 101 110 101 101', L:'100 100 100 100 111',
  M:'101 111 111 101 101', N:'110 101 101 101 101', O:'010 101 101 101 010', P:'110 101 110 100 100',
  Q:'010 101 101 111 011', R:'110 101 110 101 101', S:'011 100 010 001 110', T:'111 010 010 010 010',
  U:'101 101 101 101 111', V:'101 101 101 101 010', W:'101 101 111 111 101', X:'101 101 010 101 101',
  Y:'101 101 010 010 010', Z:'111 001 010 100 111',
  0:'111 101 101 101 111', 1:'010 110 010 010 111', 2:'110 001 010 100 111', 3:'110 001 010 001 110',
  4:'101 101 111 001 001', 5:'111 100 110 001 110', 6:'011 100 111 101 111', 7:'111 001 010 010 010',
  8:'111 101 111 101 111', 9:'111 101 111 001 110',
  '-':'000 000 111 000 000', '.':'000 000 000 000 010', ':':'000 010 000 010 000',
  '=':'000 111 000 111 000', '+':'000 010 111 010 000', '!':'010 010 010 000 010', '?':'110 001 010 000 010',
};
const GL = {};
for (const k in FONT) GL[k] = FONT[k].replace(/ /g, '');

const textW = (s, sc) => s.length * 4 * sc - sc;
function text(s, x, y, col, sc = 1, align = 'l') {
  s = String(s).toUpperCase();
  if (align === 'c') x = Math.round(x - textW(s, sc) / 2);
  else if (align === 'r') x -= textW(s, sc);
  cx.fillStyle = col;
  for (let i = 0; i < s.length; i++) {
    const g = GL[s[i]];
    if (!g) continue;
    for (let k = 0; k < 15; k++) {
      if (g[k] === '1') cx.fillRect(x + i * 4 * sc + (k % 3) * sc, y + ((k / 3) | 0) * sc, sc, sc);
    }
  }
}

// bordered caption box; lines = [{t, c, s}]
function card(lines, y, cxp = 90, border = P.fg) {
  let w = 0, h = 4;
  for (const l of lines) { const s = l.s || 1; w = Math.max(w, textW(String(l.t), s)); h += 5 * s + 3; }
  w += 10;
  const x = Math.round(cxp - w / 2);
  cx.fillStyle = P.shadow; cx.fillRect(x + 2, y + 2, w, h);
  cx.fillStyle = P.bg;     cx.fillRect(x, y, w, h);
  cx.fillStyle = border;
  cx.fillRect(x, y, w, 1); cx.fillRect(x, y + h - 1, w, 1);
  cx.fillRect(x, y, 1, h); cx.fillRect(x + w - 1, y, 1, h);
  let ty = y + 4;
  for (const l of lines) { const s = l.s || 1; text(l.t, cxp, ty, l.c || P.fg, s, 'c'); ty += 5 * s + 3; }
  return h;
}

const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];

function fillCircle(x, y, r, col) {
  cx.fillStyle = col;
  for (let dy = -r; dy <= r; dy++) {
    const dx = Math.floor(Math.sqrt((r + .5) * (r + .5) - dy * dy));
    cx.fillRect(x - dx, y + dy, 2 * dx + 1, 1);
  }
}

// ordered-dither ring/disc, d = 0..1 density
function ditherCircle(x, y, r0, r1, col, d) {
  cx.fillStyle = col;
  const lvl = d * 16;
  for (let py = y - r1; py <= y + r1; py++) {
    for (let px = x - r1; px <= x + r1; px++) {
      const dd = (px - x) ** 2 + (py - y) ** 2;
      if (dd <= r1 * r1 && dd >= r0 * r0 && BAYER[(py & 3) * 4 + (px & 3)] < lvl) cx.fillRect(px, py, 1, 1);
    }
  }
}

function plot(x0, x1, fy, col, th = 2) {
  cx.fillStyle = col;
  let py = null;
  for (let x = x0; x <= x1; x++) {
    const y = Math.round(fy(x));
    const a = py === null ? y : py;
    const lo = Math.min(a, y), hi = Math.max(a, y);
    cx.fillRect(x, lo, 1, hi - lo + th);
    py = y;
  }
}

// dithered wipe overlays: fade[n] has n/16 of a 4x4 tile in bg colour
const fade = [];
for (let n = 0; n <= 16; n++) {
  const t = document.createElement('canvas'); t.width = t.height = 4;
  const c = t.getContext('2d'); c.fillStyle = P.bg;
  for (let i = 0; i < 16; i++) if (BAYER[i] < n) c.fillRect(i % 4, (i / 4) | 0, 1, 1);
  fade.push(cx.createPattern(t, 'repeat'));
}

// listener seen from behind, so screen-left is the listener's left ear
function head(hx, hy, o = {}) {
  // neck + shoulders
  cx.fillStyle = P.skin; cx.fillRect(hx - 7, hy + 22, 14, 16);
  for (let i = 0; i < 18; i++) {
    const hw = Math.min(34, 16 + i * 2);
    cx.fillStyle = P.shirt; cx.fillRect(hx - hw, hy + 34 + i, hw * 2, 1);
  }
  // head
  fillCircle(hx, hy, 27, P.hair);
  cx.fillStyle = P.hairL;
  for (let py = hy - 20; py <= hy; py++) {
    for (let px = hx - 18; px <= hx; px++) {
      const a = (px - (hx - 9)) ** 2 + (py - (hy - 11)) ** 2;
      const inHead = (px - hx) ** 2 + (py - hy) ** 2 < 24 * 24;
      if (a < 64 && inHead && ((px + py) & 1) === 0) cx.fillRect(px, py, 1, 1);
    }
  }
  // ears
  fillCircle(hx - 27, hy + 4, 4, P.skin);
  fillCircle(hx + 27, hy + 4, 4, P.skin);
  if (o.phones) {
    cx.fillStyle = P.band;
    for (let a = Math.PI; a <= 2 * Math.PI; a += 0.04) {
      cx.fillRect(Math.round(hx + Math.cos(a) * 31), Math.round(hy + 6 + Math.sin(a) * 36), 2, 2);
    }
    cx.fillStyle = P.shadow; cx.fillRect(hx - 37, hy - 3, 9, 18); cx.fillRect(hx + 29, hy - 3, 9, 18);
    cx.fillStyle = P.L;      cx.fillRect(hx - 36, hy - 2, 7, 16);
    cx.fillStyle = P.R;      cx.fillRect(hx + 30, hy - 2, 7, 16);
  }
  if (o.brain) {
    const g = o.glow;
    ditherCircle(hx, hy - 4, 18, 28, P.sum, g * 0.7);
    fillCircle(hx, hy - 4, 18, P.edge);
    fillCircle(hx, hy - 4, 17, P.bg);
    const c = g < 0.33 ? P.brain1 : g < 0.66 ? P.brain2 : P.sum;
    fillCircle(hx - 7, hy - 5, 9, c);
    fillCircle(hx + 7, hy - 5, 9, c);
    fillCircle(hx, hy + 3, 6, c);
    cx.fillStyle = P.fold;
    cx.fillRect(hx, hy - 13, 1, 12);
    for (const [fx, fy] of [[-12, -7], [-9, -2], [-5, -9], [4, -9], [7, -2], [10, -7], [-3, 3], [2, 4]]) cx.fillRect(hx + fx, hy + fy, 3, 1);
  }
}

// ---------- audio (everything synthesised) ----------
let ac = null, master = null, bus = null, T0 = 0, muted = false;
let sq125, sq25, sq50, noiseBuf;

const midi = m => 440 * Math.pow(2, (m - 69) / 12);

function pulseWave(d) {
  const N = 64, re = new Float32Array(N), im = new Float32Array(N);
  for (let n = 1; n < N; n++) {
    const a = 2 / (n * Math.PI);
    re[n] = a * Math.sin(n * Math.PI * d) * Math.cos(n * Math.PI * d);
    im[n] = a * Math.sin(n * Math.PI * d) ** 2;
  }
  return ac.createPeriodicWave(re, im);
}

function voice(wave, f, t, dur, vol, hold) {
  const o = ac.createOscillator();
  if (typeof wave === 'string') o.type = wave; else o.setPeriodicWave(wave);
  o.frequency.setValueAtTime(f, t);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.004);
  if (hold) { g.gain.setValueAtTime(vol, t + dur - 0.03); g.gain.linearRampToValueAtTime(0.0001, t + dur); }
  else g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(bus);
  o.start(t); o.stop(t + dur + 0.02);
}

function noise(t, dur, vol, hp, bp) {
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const f = ac.createBiquadFilter();
  if (hp) { f.type = 'highpass'; f.frequency.value = hp; } else { f.type = 'bandpass'; f.frequency.value = bp; }
  const g = ac.createGain();
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(bus);
  s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
}

// A minor loop: Am F C G, two bars of 16th steps. Everything sits well above the binaural tones.
const CHORDS = [[69, 72, 76], [65, 69, 72], [72, 76, 79], [67, 71, 74]];
const ROOTS = [57, 53, 60, 55];
const LEAD = [76,0,0,0, 72,0,0,0, 74,0,76,0, 77,0,0,0,  76,0,0,0, 72,0,0,0, 69,0,71,0, 72,0,0,0];
const BPM = 132, STEP = 60 / BPM / 4;
let nextT = 0, step = 0;

function playStep(s, t) {
  const i = s % 32, ch = (i / 8) | 0;
  if (LEAD[i]) voice(sq125, midi(LEAD[i]), t, STEP * 3.5, 0.30);
  if (i % 2 === 0) voice(sq25, midi(CHORDS[ch][(i / 2) % 3] + 12), t, STEP * 1.2, 0.10);
  if (i % 4 === 2) noise(t, 0.04, 0.35, 7000);
  if (i === 8 || i === 24) noise(t, 0.12, 0.45, 0, 1800);
}

function playStepBass(s, t) {
  const i = s % 32, ch = (i / 8) | 0;
  if (i % 2 === 0) voice('triangle', midi(ROOTS[ch]), t, STEP * 1.9, 0.5, true);
}

function schedule() {
  while (nextT < ac.currentTime + 0.15) {
    playStepBass(step, nextT);
    playStep(step, nextT);
    nextT += STEP; step++;
  }
}

function blip() {
  if (!ac || ac.state !== 'running') return;
  const t = ac.currentTime;
  voice(sq50, 880, t, 0.08, 0.25);
  voice(sq50, 1320, t + 0.06, 0.10, 0.25);
}

function startAudio() {
  ac = new (window.AudioContext || window.webkitAudioContext)();
  master = ac.createGain();
  master.gain.value = 0.0001;
  master.connect(ac.destination);
  bus = ac.createGain(); bus.gain.value = 0.28; bus.connect(master);        // chiptune, centre-panned, kept low
  sq125 = pulseWave(0.125); sq25 = pulseWave(0.25); sq50 = pulseWave(0.5);
  noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

  T0 = ac.currentTime + 0.15;
  // the binaural pair: pure sines, hard-panned, bypassing the chiptune bus
  for (const [f, pan] of [[FL, -1], [FR, 1]]) {
    const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = f;
    const g = ac.createGain(); g.gain.value = 0.35;
    const p = ac.createStereoPanner(); p.pan.value = pan;
    o.connect(g); g.connect(p); p.connect(master);
    o.start(T0);
  }
  nextT = T0; step = 0;
  setInterval(schedule, 40);
  master.gain.setTargetAtTime(muted ? 0.0001 : 0.9, ac.currentTime, 0.25);
  ac.resume();
}

function toggle() {
  if (!ac) { startAudio(); return; }
  if (ac.state === 'running') ac.suspend(); else ac.resume();
}
function toggleMute() {
  muted = !muted;
  if (ac) master.gain.setTargetAtTime(muted ? 0.0001 : 0.9, ac.currentTime, 0.1);
}
cv.addEventListener('click', toggle);
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.key === 'm' || e.key === 'M') toggleMute();
});

// ---------- scenes ----------
const glow = tau => BEAT === 0 ? 1 : 0.5 + 0.5 * Math.cos(2 * Math.PI * BEAT * tau);
const banner = (t, c = P.sum) => card([{ t, c }], 6);

function sceneTitle(tau, ctl) {
  card([{ t: 'BINAURAL', c: P.sum, s: 3 }, { t: 'BEATS', c: P.fg, s: 3 }], 36);
  text('TWO TONES. ONE PULSE.', 90, 100, P.dim, 1, 'c');
  const hx = 90, hy = 175;
  plot(2, 54, x => hy + 6 + 5 * Math.sin(x * FL / 800 * 2 * Math.PI - tau * FL * SLOW * 2 * Math.PI), P.L);
  plot(126, 178, x => hy + 6 + 5 * Math.sin(x * FR / 800 * 2 * Math.PI + tau * FR * SLOW * 2 * Math.PI), P.R);
  head(hx, hy, { phones: true });
  const on = ((performance.now() / 500) | 0) % 2 === 0;
  if (!ctl.started) { if (on) card([{ t: 'TAP TO START', c: P.sum, s: 2 }], 255); }
  else if (on) card([{ t: 'USE HEADPHONES', c: P.sum, s: 2 }], 255);
}

function sceneEars(tau) {
  banner('SCHEMATIC: SLOWED');
  const hx = 90, hy = 165, ey = hy + 6, A = 10, w = 2 * Math.PI;
  plot(2, 52, x => ey + A * Math.sin(w * (x * FL / 800 - FL * SLOW * tau)), P.L);
  plot(128, 178, x => ey + A * Math.sin(w * (x * FR / 800 + FR * SLOW * tau)), P.R);
  head(hx, hy, { phones: true });
  card([{ t: 'LEFT EAR', c: P.L }, { t: `${FL} HZ`, c: P.L, s: 2 }], 100, 34, P.L);
  card([{ t: 'RIGHT EAR', c: P.R }, { t: `${FR} HZ`, c: P.R, s: 2 }], 100, 146, P.R);
  card([{ t: 'A DIFFERENT TONE' }, { t: 'IN EACH EAR' }], 245);
}

function sceneCompare(tau) {
  banner('SCHEMATIC: SLOWED');
  const w = 2 * Math.PI, A = 12, x0 = 10, x1 = 169;
  const pL = x => w * ((x - x0) * FL / 800 - FL * SLOW * tau);
  const pR = x => w * ((x - x0) * FR / 800 - FR * SLOW * tau);
  const rows = [[78, P.L, `L ${FL} HZ`, pL], [122, P.R, `R ${FR} HZ`, pR]];
  for (const [cy, col, lab, ph] of rows) {
    text(lab, x0, cy - 28, col);
    cx.fillStyle = P.grid; for (let x = x0; x <= x1; x += 4) cx.fillRect(x, cy, 2, 1);
    plot(x0, x1, x => cy + A * Math.sin(ph(x)) - 1, col);
  }
  const cy = 192;
  text('WHAT YOUR BRAIN COMPARES', 90, cy - 38, P.dim, 1, 'c');
  const diff = x => (x - x0) * BEAT / 800 - BEAT * SLOW * tau;
  cx.fillStyle = P.grid; for (let x = x0; x <= x1; x += 4) cx.fillRect(x, cy, 2, 1);
  plot(x0, x1, x => cy + A * 0.5 * (Math.sin(pL(x)) + Math.sin(pR(x))) - 1, P.sum);
  cx.fillStyle = P.dim;
  for (let x = x0; x <= x1; x += 2) {
    const e = A * Math.abs(Math.cos(Math.PI * diff(x)));
    cx.fillRect(x, Math.round(cy - e) - 2, 1, 1); cx.fillRect(x, Math.round(cy + e) + 1, 1, 1);
  }
  card([{ t: 'IN STEP = LOUD' }, { t: 'OUT OF STEP = QUIET' }, { t: `FLIPS ${BEAT} TIMES A SECOND`, c: P.sum }], 238);
}

function sceneBrain(tau) {
  banner('REAL SPEED');
  const hx = 90, hy = 100, g = glow(tau);
  head(hx, hy, { phones: true, brain: true, glow: g });
  for (let i = 0; i < 3; i++) {
    const f = (tau * 1.5 + i / 3) % 1;
    cx.fillStyle = P.L; cx.fillRect(Math.round(hx - 33 + 26 * f), Math.round(hy + 6 - 10 * f), 2, 2);
    cx.fillStyle = P.R; cx.fillRect(Math.round(hx + 33 - 26 * f), Math.round(hy + 6 - 10 * f), 2, 2);
  }
  const n = String(Math.floor(tau * BEAT) % 10000).padStart(4, '0');
  card([{ t: `${BEAT} HZ PULSE`, c: P.sum, s: 2 }, { t: `PULSE ${n}`, c: P.dim }], 170);
  text('WHAT YOU FEEL', 90, 213, P.dim, 1, 'c');
  const oy = 270, amp = 34;
  cx.fillStyle = P.grid; for (let x = 10; x <= 170; x += 4) cx.fillRect(x, oy, 2, 1);
  const val = x => glow(tau - (170 - x) / 160);
  cx.fillStyle = P.edge;
  for (let x = 10; x <= 170; x += 2) {
    const y = Math.round(oy - amp * val(x));
    for (let yy = y + 2; yy < oy; yy += 2) cx.fillRect(x + ((yy >> 1) & 1), yy, 1, 1);
  }
  plot(10, 170, x => oy - amp * val(x), P.sum);
  card([{ t: 'ONLY IN YOUR HEAD' }], 288);
}

function sceneOutro(tau) {
  card([{ t: `${FR}-${FL}=${BEAT}`, c: P.sum, s: 3 }, { t: 'THE BEAT FREQUENCY', c: P.dim }], 20);
  head(90, 140, { phones: true, brain: true, glow: glow(tau) });
  card([{ t: `NO ${BEAT} HZ SOUND PLAYS` }, { t: 'YOUR BRAIN CREATES THE BEAT', c: P.sum }], 218);
  text('WAVES SLOWED FOR DISPLAY', 90, 300, P.edge, 1, 'c');
}

const SCENES = [sceneTitle, sceneEars, sceneCompare, sceneBrain, sceneOutro];

// ---------- main loop ----------
let lastScene = -1;
function frame() {
  const started = !!ac;
  let tau = 0;
  if (started) tau = Math.max(0, ac.currentTime - T0 - (ac.outputLatency || 0));
  else if (DEBUG_T !== null) tau = DEBUG_T;
  const t = tau % LOOP;

  let si = 0, acc = 0;
  while (si < DUR.length - 1 && t >= acc + DUR[si]) { acc += DUR[si]; si++; }
  const local = t - acc;
  if (si !== lastScene) { if (lastScene !== -1) blip(); lastScene = si; }

  cx.fillStyle = P.bg; cx.fillRect(0, 0, W, H);
  cx.fillStyle = P.grid;
  for (let y = 4; y < H; y += 10) for (let x = 4; x < W; x += 10) cx.fillRect(x, y, 1, 1);

  SCENES[si](tau, { started });

  if (local < 0.35 && started) {
    cx.fillStyle = fade[Math.ceil(16 * (1 - local / 0.35))];
    cx.fillRect(0, 0, W, H);
  }
  if (started && ac.state === 'suspended') card([{ t: 'PAUSED', c: P.sum, s: 2 }], 150);
  requestAnimationFrame(frame);
}
frame();
})();
</script>
</body>
</html>
