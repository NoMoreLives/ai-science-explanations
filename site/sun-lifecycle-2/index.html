<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Life of a Sun: Hardcore Mix</title>
<style>
  html,body{margin:0;height:100%;background:#020108;color:#6a66a0;font:12px monospace}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center}
  canvas{height:min(92vh,calc(100vw*16/9));aspect-ratio:9/16;image-rendering:pixelated;cursor:pointer;background:#07060f}
  p{margin:6px 16px 0;text-align:center}
</style>
</head>
<body>
<canvas id="c" width="180" height="320"></canvas>
<p>click / space: play-pause &middot; m: mute &middot; turn it up &middot; ?bpm=150 &amp;drive=40 &amp;giant=200 &amp;calm=1 (no shake/flash)</p>
<script>
(() => {
'use strict';

// ---------- config ----------
const q = new URLSearchParams(location.search);
const num = (k, d, lo, hi) => { const n = parseFloat(q.get(k)); return n >= lo && n <= hi ? n : d; };
const BPM = num('bpm', 150, 100, 200);
const DRIVE = num('drive', 40, 0, 100);   // distortion on kick + bass
const GIANT = num('giant', 200, 50, 260); // red giant radius / today's radius
const CALM = q.get('calm') === '1';       // no screen shake, glitches or flashes
const DEBUG_T = q.has('t') ? parseFloat(q.get('t')) : null; // freeze visuals at t seconds (no audio)

// a one-solar-mass star; every number drawn on screen comes from here
const STAR = {
  nebulaYrs: 1e6,      // cloud core collapses to a protostar
  protoYrs: 50e6,      // protostar until hydrogen fusion switches on
  mainYrs: 10e9,       // main sequence (hydrogen burning) lifetime
  nowYrs: 4.6e9,       // the Sun today
  giantYrs: 1e9,       // subgiant + red giant branch
  pnYrs: 20e3,         // planetary nebula stays visible
  wdYrs: 1e12,         // white dwarf cooling (it carries on far longer)
  cloudC: -260,        // molecular cloud temperature
  igniteK: 10e6,       // core temperature for hydrogen fusion
  coreNowK: 15e6,      // core temperature today
  heliumK: 100e6,      // core temperature for helium fusion
  sunAU: 0.00465,      // solar radius in AU
  planets: [['MERCURY', 0.387, 0.241, '#c9b9a8'], ['VENUS', 0.723, 0.615, '#f0cc80'], ['EARTH', 1.0, 1.0, '#4aa8ff']],
};

const W = 180, H = 320;
const STEP = 60 / BPM / 4, BAR = STEP * 16, BEAT = STEP * 4;

// the track: one section per phase of the star's life, each showcasing one layer
const SONG = [
  { id: 'title', bars: 2 },
  { id: 'nebula', bars: 8 },   // layer 1: drone
  { id: 'proto', bars: 8 },    // layer 2: kick
  { id: 'main', bars: 8 },     // layer 3: rumble bass (+ kick = balance)
  { id: 'giant', bars: 8 },    // layer 4: hoover lead
  { id: 'flash', bars: 4 },    // layer 5: snare roll build
  { id: 'drop', bars: 16 },    // everything (+ arp): planetary nebula, white dwarf
  { id: 'outro', bars: 4 },    // drone: cooling
];
const BAR_SEC = [];
{ let a = 0; SONG.forEach((s, k) => { s.start = a; s.k = k; a += s.bars; for (let b = 0; b < s.bars; b++) BAR_SEC.push(k); }); }
const TOTAL_STEPS = BAR_SEC.length * 16;
const LOOP = TOTAL_STEPS * STEP;
const IGNITE_BAR = 4; // protostar: kick goes four-on-the-floor here

// F minor: Fm Fm Db Eb
const ROOT = [41, 41, 37, 39];
const CHORDS = [[53, 56, 60], [53, 56, 60], [49, 53, 56], [51, 55, 58]];
const RIFF = [
  [65,0,65,0, 68,0,65,0, 72,0,70,0, 68,0,67,0],
  [65,0,65,0, 68,0,65,0, 75,0,73,0, 72,0,68,0],
  [61,0,61,0, 65,0,61,0, 68,0,65,0, 73,0,72,0],
  [63,0,63,0, 67,0,63,0, 70,0,75,0, 72,0,70,67],
];

function at(s) {
  s = ((s % TOTAL_STEPS) + TOTAL_STEPS) % TOTAL_STEPS;
  const bar = (s / 16) | 0, sec = SONG[BAR_SEC[bar]];
  return { sec, id: sec.id, lb: bar - sec.start, i: s % 16 };
}

// single source of truth for what plays on step s: audio, HUD and visuals all read this
function hit(layer, s) {
  const { id, lb, i } = at(s), ch = lb % 4, onBeat = i % 4 === 0;
  const roll = id === 'drop' && lb % 8 === 7 && i >= 12; // kick roll into the next 8
  switch (layer) {
    case 'drone': return (id === 'nebula' || id === 'drop' || id === 'outro') && i === 0 ? 1 : 0;
    case 'clank': return id === 'nebula' && (i === 6 || (i === 14 && lb % 2 === 1)) ? 1 : 0;
    case 'kick':
      if (id === 'proto') return lb < 2 ? (i === 0 ? 0.7 : 0) : lb < IGNITE_BAR ? (i % 8 === 0 ? 0.85 : 0) : (onBeat ? 1 : 0);
      if (id === 'main') return lb >= 4 && onBeat ? 0.9 : 0;
      if (id === 'drop') return roll || onBeat ? 1 : 0;
      return 0;
    case 'bass': return (id === 'main' || (id === 'drop' && !roll)) && !onBeat ? ROOT[ch] : 0;
    case 'lead': return id === 'giant' || id === 'drop' ? RIFF[ch][i] : 0;
    case 'snare': {
      if (id !== 'flash' || (lb === 3 && i >= 12)) return 0; // last beat: silence before the drop
      return i % [4, 2, 1, 1][lb] === 0 ? (lb === 3 ? 2 : 1) : 0;
    }
    case 'clap': return id === 'drop' && (i === 4 || i === 12) ? 1 : 0;
    case 'ohat': return id === 'drop' && i % 4 === 2 ? 1 : 0;
    case 'hat': return id === 'drop' && i % 2 === 1 ? 1 : 0;
    case 'crash': return id === 'drop' && i === 0 && lb % 8 === 0 ? 1 : 0;
    case 'arp': return id === 'drop' && lb >= 8 ? CHORDS[ch][i % 3] + 24 + (i % 8 >= 6 ? 12 : 0) : 0;
    case 'perc': return hit('snare', s) || hit('clap', s) || hit('ohat', s) || hit('hat', s);
  }
  return 0;
}

const P = {
  bg: '#07060f', grid: '#16133a', edge: '#3a3570', dim: '#8a86c0', fg: '#f4f1de', shadow: '#000000', white: '#ffffff',
  drone: '#a070ff', droneD: '#3e2a7a', neb: '#ff5fa8', nebD: '#5a1f50',
  kick: '#ffd23f', kickD: '#7a5a10', bass: '#ff8a2a', bassD: '#7a3510',
  lead: '#ff3b4e', leadD: '#6a1424', perc: '#bfefff', percD: '#2e5a6a', arp: '#3df0b0', arpD: '#14684c',
  grav: '#3d7bff', hot: '#fff6c8', cool: '#7aa8ff',
};
// sun palettes: [glow, limb, body, hot spot]
const SUN_Y = [P.kick, '#ff9a1a', P.kick, P.hot];
const SUN_O = [P.bass, '#c8481a', P.bass, '#ffc070'];
const SUN_R = [P.lead, '#7a1020', '#d02a3a', '#ff7a5a'];
const SUN_W = [P.cool, '#bcd4ff', P.white, P.white];
const CYC = [P.arp, P.lead, P.drone, P.kick, P.bass];

// ---------- canvas + gfx helpers ----------
const cv = document.getElementById('c');
const cx = cv.getContext('2d');
cx.imageSmoothingEnabled = false;

// 3x5 pixel font, rows top to bottom
const FONT = {
  A:'010 101 111 101 101', B:'110 101 110 101 110', C:'011 100 100 100 011', D:'110 101 101 101 110',
  E:'111 100 110 100 111', F:'111 100 110 100 100', G:'011 100 101 101 011', H:'101 101 111 101 101',
  I:'111 010 010 010 111', J:'001 001 001 101 010', K:'101 101 110 101 101', L:'100 100 100 100 111',
  M:'101 111 111 101 101', N:'110 101 101 101 101', O:'010 101 101 101 010', P:'110 101 110 100 100',
  Q:'010 101 101 111 011', R:'110 101 110 101 101', S:'011 100 010 001 110', T:'111 010 010 010 010',
  U:'101 101 101 101 111', V:'101 101 101 101 010', W:'101 101 111 111 101', X:'101 101 010 101 101',
  Y:'101 101 010 010 010', Z:'111 001 010 100 111',
  0:'111 101 101 101 111', 1:'010 110 010 010 111', 2:'110 001 010 100 111', 3:'110 001 010 001 110',
  4:'101 101 111 001 001', 5:'111 100 110 001 110', 6:'011 100 111 101 111', 7:'111 001 010 010 010',
  8:'111 101 111 101 111', 9:'111 101 111 001 110',
  '-':'000 000 111 000 000', '.':'000 000 000 000 010', ':':'000 010 000 010 000',
  '=':'000 111 000 111 000', '+':'000 010 111 010 000', '!':'010 010 010 000 010', '?':'110 001 010 000 010',
  '>':'100 010 001 010 100', '<':'001 010 100 010 001', '/':'001 001 010 100 100', ',':'000 000 000 010 100',
  '(':'010 100 100 100 010', ')':'010 001 001 001 010', "'":'010 010 000 000 000', '~':'000 011 110 000 000',
};
const GL = {};
for (const k in FONT) GL[k] = FONT[k].replace(/ /g, '');

const textW = (s, sc) => s.length * 4 * sc - sc;
function text(s, x, y, col, sc = 1, align = 'l') {
  s = String(s).toUpperCase();
  if (align === 'c') x = Math.round(x - textW(s, sc) / 2);
  else if (align === 'r') x -= textW(s, sc);
  cx.fillStyle = col;
  for (let i = 0; i < s.length; i++) {
    const g = GL[s[i]];
    if (!g) continue;
    for (let k = 0; k < 15; k++) {
      if (g[k] === '1') cx.fillRect(x + i * 4 * sc + (k % 3) * sc, y + ((k / 3) | 0) * sc, sc, sc);
    }
  }
}

// bordered caption box; lines = [{t, c, s}]
function card(lines, y, cxp = 90, border = P.fg) {
  let w = 0, h = 4;
  for (const l of lines) { const s = l.s || 1; w = Math.max(w, textW(String(l.t), s)); h += 5 * s + 3; }
  w += 10;
  const x = Math.round(cxp - w / 2);
  cx.fillStyle = P.shadow; cx.fillRect(x + 2, y + 2, w, h);
  cx.fillStyle = P.bg;     cx.fillRect(x, y, w, h);
  cx.fillStyle = border;
  cx.fillRect(x, y, w, 1); cx.fillRect(x, y + h - 1, w, 1);
  cx.fillRect(x, y, 1, h); cx.fillRect(x + w - 1, y, 1, h);
  let ty = y + 4;
  for (const l of lines) { const s = l.s || 1; text(l.t, cxp, ty, l.c || P.fg, s, 'c'); ty += 5 * s + 3; }
  return h;
}

const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const bay = (x, y) => BAYER[(y & 3) * 4 + (x & 3)];

function fillCircle(x, y, r, col) {
  if (r < 0) return;
  cx.fillStyle = col;
  for (let dy = -r; dy <= r; dy++) {
    const dx = Math.floor(Math.sqrt((r + .5) * (r + .5) - dy * dy));
    cx.fillRect(x - dx, y + dy, 2 * dx + 1, 1);
  }
}

// ordered-dither ring/disc, d = 0..1 density
function ditherCircle(x, y, r0, r1, col, d) {
  if (d <= 0) return;
  cx.fillStyle = col;
  const lvl = d * 16;
  for (let py = y - r1; py <= y + r1; py++) {
    if (py < 0 || py >= H) continue;
    for (let px = x - r1; px <= x + r1; px++) {
      const dd = (px - x) ** 2 + (py - y) ** 2;
      if (dd <= r1 * r1 && dd >= r0 * r0 && bay(px, py) < lvl) cx.fillRect(px, py, 1, 1);
    }
  }
}

// thin dithered ring, sampled by angle (cheap for big radii); sy squashes it into an ellipse
function ring(x, y, r, col, th, d, sy = 1) {
  if (d <= 0 || r < 1) return;
  cx.fillStyle = col;
  const lvl = d * 16, n = Math.ceil(r * 7) + 8;
  for (let k = 0; k < n; k++) {
    const a = k / n * 2 * Math.PI, c = Math.cos(a), s = Math.sin(a);
    for (let j = 0; j < th; j++) {
      const px = Math.round(x + c * (r + j)), py = Math.round(y + s * (r + j) * sy);
      if (bay(px, py) < lvl) cx.fillRect(px, py, 1, 1);
    }
  }
}

function line(x0, y0, x1, y1, col, d = 1) {
  cx.fillStyle = col;
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1);
  for (let k = 0; k <= n; k++) {
    const px = Math.round(x0 + (x1 - x0) * k / n), py = Math.round(y0 + (y1 - y0) * k / n);
    if (d >= 1 || bay(px, py) < d * 16) cx.fillRect(px, py, 1, 1);
  }
}

function arrow(x0, y0, x1, y1, col) {
  line(x0, y0, x1, y1, col);
  const a = Math.atan2(y1 - y0, x1 - x0);
  for (const s of [-1, 1]) line(x1, y1, x1 + 4 * Math.cos(a + s * 2.5), y1 + 4 * Math.sin(a + s * 2.5), col);
}

// dithered pattern fills: d of a 4x4 tile in col (cached)
const PAT = {};
function ditherFill(col, d) {
  const n = Math.max(0, Math.min(16, Math.round(d * 16)));
  if (!n) return;
  const key = col + n;
  if (!PAT[key]) {
    const t = document.createElement('canvas'); t.width = t.height = 4;
    const c = t.getContext('2d'); c.fillStyle = col;
    for (let i = 0; i < 16; i++) if (BAYER[i] < n) c.fillRect(i % 4, (i / 4) | 0, 1, 1);
    PAT[key] = cx.createPattern(t, 'repeat');
  }
  cx.fillStyle = PAT[key]; cx.fillRect(0, 0, W, H);
}

function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rng = mulberry(1987);
const hash = n => { n = Math.imul(n ^ 0x5bd1e995, 0x27d4eb2d); n ^= n >>> 15; n = Math.imul(n, 0x85ebca6b); n ^= n >>> 13; return (n >>> 0) / 4294967296; };

// a star: dithered corona, limb, body, hot spot and boiling granulation
function sun(x, y, r, pal, t, glow = 0.35) {
  r = Math.max(1, Math.round(r));
  ditherCircle(x, y, r, Math.round(r * 1.3) + 4, pal[0], glow);
  fillCircle(x, y, r, pal[1]);
  if (r < 3) return;
  fillCircle(x, y, r - 2, pal[2]);
  fillCircle(x - Math.round(r * 0.22), y - Math.round(r * 0.22), Math.round(r * 0.5), pal[3]);
  if (r < 6) return;
  cx.fillStyle = pal[1];
  const rr = (r - 2) * (r - 2), sc = 6 / r + 0.25;
  for (let py = -r + 2; py <= r - 2; py++) {
    for (let px = -r + 2; px <= r - 2; px++) {
      if (px * px + py * py > rr) continue;
      const v = Math.sin(px * sc * 1.7 + t * 1.9) * Math.sin(py * sc * 2.1 - t * 1.3) + Math.sin((px - py) * sc + t * 0.7) * 0.6;
      if (v > 0.95 && bay(x + px, y + py) < 8) cx.fillRect(x + px, y + py, 1, 1);
    }
  }
}

// background stars: twinkling, or warp streaks flying out of the centre
const STARS = Array.from({ length: 90 }, () => ({ x: rng() * W | 0, y: rng() * H | 0, a: rng() * 6.283, d: rng(), b: rng() }));
function stars(t, bright = 0) {
  const tw = Math.floor(t * 6);
  for (let k = 0; k < STARS.length; k++) {
    const s = STARS[k];
    const on = (k * 7 + tw) % 11 === 0 || s.b < bright;
    cx.fillStyle = on ? P.fg : s.b > 0.6 ? P.dim : P.edge;
    cx.fillRect(s.x, s.y, 1, 1);
  }
}
function warp(t, kick, x0 = 90, y0 = 112) {
  for (let k = 0; k < STARS.length; k++) {
    const s = STARS[k], d = (s.d + t * (0.22 + s.b * 0.25)) % 1;
    const r = 6 + d * d * 150, len = 1 + d * (3 + kick * 16);
    line(x0 + Math.cos(s.a) * r, y0 + Math.sin(s.a) * r, x0 + Math.cos(s.a) * (r + len), y0 + Math.sin(s.a) * (r + len), d > 0.5 ? P.fg : P.dim);
  }
}

// shift a few horizontal slices sideways (pixel-exact glitch)
function glitch(seed, n) {
  for (let j = 0; j < n; j++) {
    const y = hash(seed * 31 + j) * (H - 60) | 0, h = 2 + (hash(seed * 17 + j) * 6 | 0);
    const dx = Math.round((hash(seed * 7 + j) - 0.5) * 16);
    cx.drawImage(cv, 0, y, W, h, dx, y, W, h);
  }
}

// ---------- text helpers ----------
function fmtNum(v) { return v >= 10 ? String(Math.round(v)) : String(Math.round(v * 10) / 10); }
function fmtYears(y) {
  if (y >= 1e9) return fmtNum(y / 1e9) + ' BILLION';
  if (y >= 1e6) return fmtNum(y / 1e6) + ' MILLION';
  if (y >= 1e4) return fmtNum(y / 1e3) + ' THOUSAND';
  return String(Math.round(y));
}
const fmtK = k => fmtNum(k / 1e6) + ' MILLION K';
const perBeat = (yrs, bars) => 'TIME: 1 BEAT = ' + fmtYears(yrs / (bars * 4)) + ' YRS';
const banner = (title, sub, col, subCol = P.fg) => card([{ t: title, s: 2, c: col }, { t: sub, c: subCol }], 4, 90, col);
const fact = (lines, border) => card(lines.map(l => typeof l === 'string' ? { t: l } : l), 200, 90, border);
const timeline = s => text(s, 90, 244, P.dim, 1, 'c');

// ---------- audio (everything synthesised) ----------
let ac = null, master, secGain, comp, kickIn, bassIn, padIn, leadIn, percIn, arpIn, fxSend;
let sq125, sq25, sq50, noiseBuf, T0 = 0, muted = false, step = 0;

const midi = m => 440 * Math.pow(2, (m - 69) / 12);
// every node made while one step is being scheduled; all are disconnected once that step's last sound ends,
// so finished notes don't pile up in the audio graph
let bag = null;
const track = n => { if (bag) bag.push(n); return n; };
const G = v => { const g = track(ac.createGain()); g.gain.value = v; return g; };
const F = (type, f, Q = 0.7) => { const b = track(ac.createBiquadFilter()); b.type = type; b.frequency.value = f; b.Q.value = Q; return b; };
const chain = (...n) => { for (let i = 0; i < n.length - 1; i++) n[i].connect(n[i + 1]); return n[0]; };

function pulseWave(d) {
  const N = 64, re = new Float32Array(N), im = new Float32Array(N);
  for (let n = 1; n < N; n++) {
    const a = 2 / (n * Math.PI);
    re[n] = a * Math.sin(n * Math.PI * d) * Math.cos(n * Math.PI * d);
    im[n] = a * Math.sin(n * Math.PI * d) ** 2;
  }
  return ac.createPeriodicWave(re, im);
}

// tanh saturation quantised to a few levels: the crunch
function crunch(k, levels) {
  const n = 4096, c = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const x = i / (n - 1) * 2 - 1, y = Math.tanh(k * x) / Math.tanh(k);
    c[i] = Math.round(y * levels) / levels;
  }
  const s = ac.createWaveShaper(); s.curve = c; s.oversample = '4x';
  return s;
}

function osc(wave, f, t) {
  const o = track(ac.createOscillator());
  if (typeof wave === 'string') o.type = wave; else o.setPeriodicWave(wave);
  o.frequency.setValueAtTime(f, t);
  return o;
}
function env(g, t, vol, atk, dur, hold) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + atk);
  if (hold) { g.gain.setValueAtTime(vol, t + dur * hold); }
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
}
function play(o, t, dur) { o.start(t); o.stop(t + dur + 0.03); }

function buildGraph() {
  master = G(0.0001);
  comp = ac.createDynamicsCompressor();
  comp.threshold.value = -12; comp.knee.value = 4; comp.ratio.value = 6; comp.attack.value = 0.002; comp.release.value = 0.1;
  secGain = G(0.75); // section level: the drop gets the headroom
  chain(comp, secGain, master, ac.destination);
  // echo: dotted-eighth feedback delay, darkened
  const dly = ac.createDelay(1); dly.delayTime.value = STEP * 3;
  const dlp = F('lowpass', 2200), fb = G(0.4), ret = G(0.5);
  fxSend = G(1);
  chain(fxSend, dly, dlp, fb, dly); dlp.connect(ret); ret.connect(comp);
  // kick + bass: driven into the bit-crushed saturator
  kickIn = G(1 + DRIVE / 10);
  chain(kickIn, crunch(2 + DRIVE / 6, 10 + (100 - DRIVE) / 2), F('lowpass', 7000), G(0.6), comp);
  bassIn = G(1 + DRIVE / 14);
  chain(bassIn, crunch(1.5 + DRIVE / 9, 12 + (100 - DRIVE) / 2), F('lowpass', 2400), G(0.36), comp);
  padIn = G(0.5); padIn.connect(comp); padIn.connect(G(0.5)).connect(fxSend);
  leadIn = G(1); chain(leadIn, crunch(1.8, 64), F('lowpass', 4800), G(0.42), comp);
  leadIn.connect(G(0.25)).connect(fxSend);
  percIn = G(0.7); percIn.connect(comp);
  arpIn = G(0.5); arpIn.connect(comp); arpIn.connect(G(0.5)).connect(fxSend);
  sq125 = pulseWave(0.125); sq25 = pulseWave(0.25); sq50 = pulseWave(0.5);
  noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}

function noise(t, dur, vol, type, f, dest, Q = 0.8) {
  const s = track(ac.createBufferSource()); s.buffer = noiseBuf;
  const b = F(type, f, Q), g = track(ac.createGain());
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  chain(s, b, g, dest);
  s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.03);
  return b;
}

// hardcore kick: pitch drop onto a tuned tail, body held, then into the crunch
function kick(t, vel, dur, root) {
  const o = osc('sine', 400, t);
  o.frequency.exponentialRampToValueAtTime(140, t + 0.016);
  o.frequency.exponentialRampToValueAtTime(midi(root - 12), t + 0.1);
  const g = track(ac.createGain()); env(g, t, vel, 0.002, dur, 0.55);
  chain(o, g, kickIn); play(o, t, dur);
  noise(t, 0.012, vel * 0.7, 'highpass', 2500, kickIn);
}

// rolling chip bass: pulse + triangle sub through a snapping filter, then crunched
function bass(t, m, dur) {
  const f = midi(m), lp = F('lowpass', 2000, 7), g = track(ac.createGain());
  lp.frequency.setValueAtTime(2200, t); lp.frequency.exponentialRampToValueAtTime(160, t + dur);
  env(g, t, 0.8, 0.003, dur);
  chain(lp, g, bassIn);
  for (const [w, m2] of [[sq25, 1], ['triangle', 0.5]]) { const o = osc(w, f * m2, t); o.connect(lp); play(o, t, dur); }
}

// industrial pad: detuned pulses under a sweeping filter, one bar long
function pad(t, notes, dur, vol) {
  const lp = F('lowpass', 300, 5), g = track(ac.createGain());
  lp.frequency.setValueAtTime(260, t);
  lp.frequency.linearRampToValueAtTime(1500, t + dur * 0.5);
  lp.frequency.linearRampToValueAtTime(300, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.25);
  g.gain.setValueAtTime(vol, t + dur - 0.2); g.gain.linearRampToValueAtTime(0.0001, t + dur);
  chain(lp, g, padIn);
  for (const m of notes) for (const det of [-9, 9]) {
    const o = osc(sq50, midi(m), t); o.detune.value = det; o.connect(lp); play(o, t, dur);
  }
  const sub = osc('triangle', midi(notes[0] - 24), t); sub.connect(lp); play(sub, t, dur);
}

// metallic clank: inharmonic squares + noise, sent to the echo
function clank(t) {
  const bp = F('bandpass', 2400, 6), g = track(ac.createGain());
  env(g, t, 0.35, 0.001, 0.22);
  chain(bp, g, percIn); g.connect(fxSend);
  for (const f of [587, 845, 1293]) { const o = osc(sq50, f, t); o.connect(bp); play(o, t, 0.22); }
  noise(t, 0.08, 0.3, 'bandpass', 3000, fxSend, 3);
}

// hoover: detuned pulses that swoop up into pitch
function hoover(t, m, dur, vol) {
  const f = midi(m), g = track(ac.createGain());
  env(g, t, vol, 0.01, dur, 0.85);
  g.connect(leadIn);
  for (const [w, mult, det] of [[sq25, 1, -16], [sq25, 1, 16], [sq50, 0.5, 0], ['sawtooth', 1, 5]]) {
    const o = osc(w, f * mult * 0.7, t);
    o.frequency.exponentialRampToValueAtTime(f * mult, t + 0.06);
    o.detune.value = det;
    const og = G(0.2); chain(o, og, g); play(o, t, dur);
  }
}

function snare(t, vol, bpf) {
  noise(t, 0.13, vol, 'bandpass', bpf, percIn, 0.9);
  const o = osc('triangle', 220, t); o.frequency.exponentialRampToValueAtTime(150, t + 0.05);
  const g = track(ac.createGain()); env(g, t, vol * 0.6, 0.001, 0.08);
  chain(o, g, percIn); play(o, t, 0.08);
}
function clap(t) {
  for (const d of [0, 0.011, 0.022]) noise(t + d, d === 0.022 ? 0.16 : 0.012, 0.55, 'bandpass', 1500, percIn, 1.2);
  noise(t + 0.022, 0.18, 0.15, 'bandpass', 1500, fxSend, 1.2);
}
const hat = (t, open) => noise(t, open ? 0.15 : 0.03, open ? 0.32 : 0.18, 'highpass', open ? 7000 : 9000, percIn);
const crash = t => { noise(t, 1.8, 0.4, 'highpass', 4500, percIn); noise(t, 1.2, 0.2, 'bandpass', 6000, fxSend); };
function riser(t, dur, vol) {
  const s = track(ac.createBufferSource()); s.buffer = noiseBuf; s.loop = true;
  const bp = F('bandpass', 300, 2), g = track(ac.createGain());
  bp.frequency.setValueAtTime(300, t); bp.frequency.exponentialRampToValueAtTime(9000, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + dur - 0.01); g.gain.linearRampToValueAtTime(0.0001, t + dur);
  chain(s, bp, g, percIn); s.start(t); s.stop(t + dur + 0.02);
}
function arp(t, m) {
  const o = osc(sq125, midi(m), t), g = track(ac.createGain());
  env(g, t, 0.16, 0.002, STEP * 0.9);
  chain(o, g, arpIn); play(o, t, STEP);
}
function blip(t) {
  for (const [f, d] of [[880, 0], [1320, 0.06]]) {
    const o = osc(sq50, f, t + d), g = track(ac.createGain()); env(g, t + d, 0.08, 0.002, 0.09);
    chain(o, g, percIn); play(o, t + d, 0.09);
  }
}

function leadDur(ch, i) {
  let n = 1;
  while (i + n < 16 && !RIFF[ch][i + n]) n++;
  return n * STEP - 0.012;
}
function kickDur(id, lb, i) {
  if (id === 'proto') return lb < IGNITE_BAR ? 0.6 : BEAT * 0.6; // solo: long hardcore tails
  if (id === 'drop' && lb % 8 === 7 && i >= 12) return STEP * 0.9;
  return id === 'drop' ? 0.27 : 0.21; // short enough to leave room for the rolling bass
}

function playStep(s, t) {
  bag = [];
  voices(s, t);
  const nodes = bag, srcs = nodes.filter(n => typeof n.stop === 'function');
  bag = null;
  let left = srcs.length;
  for (const n of srcs) n.onended = () => { if (--left === 0) for (const m of nodes) m.disconnect(); };
}

function voices(s, t) {
  const { id, lb, i } = at(s), ch = lb % 4;
  if (i === 0 && lb === 0 && id !== 'drop' && id !== 'title') blip(t);
  if (i === 0 && lb === 0) secGain.gain.setValueAtTime(id === 'drop' ? 1 : 0.75, t);
  if (id === 'title' && lb === 0 && i === 0) riser(t, BAR * 2, 0.6);
  if (id === 'flash' && lb === 0 && i === 0) riser(t, BAR * 3.75, 1.8);
  if (hit('drone', s)) pad(t, CHORDS[ch], BAR + 0.25, id === 'drop' ? 0.09 : 0.12);
  if (hit('clank', s)) clank(t);
  const k = hit('kick', s); if (k) kick(t, k, kickDur(id, lb, i), ROOT[ch]);
  const b = hit('bass', s); if (b) bass(t, b, STEP * 0.95);
  const l = hit('lead', s); if (l) hoover(t, l, leadDur(ch, i), id === 'drop' ? 0.75 : 0.5);
  const sn = hit('snare', s);
  if (sn) {
    const p = (lb * 16 + i) / 60;
    snare(t, 0.7 + 1.0 * p, 1200 + 3200 * p);
    if (sn === 2) snare(t + STEP / 2, 0.7 + 1.0 * p, 1200 + 3200 * p);
  }
  if (hit('clap', s)) clap(t);
  if (hit('ohat', s)) hat(t, true);
  if (hit('hat', s)) hat(t, false);
  if (hit('crash', s)) crash(t);
  const a = hit('arp', s); if (a) arp(t, a);
}

function schedule() {
  if (ac.state !== 'running') return;
  const now = ac.currentTime;
  while (T0 + step * STEP < now + 0.15) {
    const t = T0 + step * STEP;
    if (t > now - 0.02) playStep(step, t); // skip steps missed while the tab was throttled
    step++;
  }
}

function startAudio() {
  ac = new (window.AudioContext || window.webkitAudioContext)();
  buildGraph();
  T0 = ac.currentTime + 0.2; step = 0;
  setInterval(schedule, 25); schedule();
  master.gain.setTargetAtTime(muted ? 0.0001 : 0.9, ac.currentTime, 0.2);
  ac.resume();
}

// offline render for checking levels without ears: __render(fromBar, bars) -> per-bar peak/rms
window.__render = async (bar0, bars, sr = 22050) => {
  ac = new OfflineAudioContext(2, Math.ceil((bars * BAR + 1) * sr), sr);
  buildGraph(); master.gain.value = 0.9;
  for (let s = bar0 * 16; s < (bar0 + bars) * 16; s++) playStep(s, 0.05 + (s - bar0 * 16) * STEP);
  const buf = await ac.startRendering();
  ac = null;
  const L = buf.getChannelData(0), out = [];
  for (let b = 0; b < bars; b++) {
    let pk = 0, sum = 0, n = 0;
    for (let i = Math.floor((0.05 + b * BAR) * sr); i < Math.floor((0.05 + (b + 1) * BAR) * sr); i++) { const v = Math.abs(L[i]); pk = Math.max(pk, v); sum += v * v; n++; }
    const s = SONG[BAR_SEC[bar0 + b]];
    out.push({ bar: bar0 + b, sec: s.id, lb: bar0 + b - s.start, peak: +pk.toFixed(3), rms: +Math.sqrt(sum / n).toFixed(3) });
  }
  return out;
};

function toggle() {
  if (!ac) { startAudio(); return; }
  if (ac.state === 'running') ac.suspend(); else ac.resume();
}
function toggleMute() {
  muted = !muted;
  if (ac) master.gain.setTargetAtTime(muted ? 0.0001 : 0.9, ac.currentTime, 0.1);
}
cv.addEventListener('click', toggle);
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.key === 'm' || e.key === 'M') toggleMute();
});

// ---------- visual envelopes, read from the same hit() table ----------
function since(layer, t, back = 64) {
  const s = Math.floor(t / STEP);
  for (let k = 0; k < back; k++) if (hit(layer, s - k)) return t - (s - k) * STEP;
  return 99;
}
const pulse = (layer, t, rate = 10) => Math.exp(-since(layer, t) * rate);
const secDur = sec => sec.bars * BAR;

// ---------- HUD: the live step sequencer ----------
const ROWS = [['DRN', 'drone', P.drone, P.droneD], ['KCK', 'kick', P.kick, P.kickD], ['BAS', 'bass', P.bass, P.bassD],
              ['LED', 'lead', P.lead, P.leadD], ['PRC', 'perc', P.perc, P.percD], ['ARP', 'arp', P.arp, P.arpD]];
function hud(t) {
  const s = Math.floor(t / STEP), b0 = s - (s % 16), cur = s % 16, y0 = 257;
  cx.fillStyle = P.shadow; cx.fillRect(6, y0 - 1, 172, 60);
  cx.fillStyle = P.bg; cx.fillRect(4, y0 - 3, 172, 60);
  cx.fillStyle = P.edge;
  cx.fillRect(4, y0 - 3, 172, 1); cx.fillRect(4, y0 + 56, 172, 1); cx.fillRect(4, y0 - 3, 1, 60); cx.fillRect(175, y0 - 3, 1, 60);
  ROWS.forEach(([lab, layer, col, dark], r) => {
    const y = y0 + 1 + r * 9;
    const held = layer === 'drone' && hit('drone', b0);
    let active = held;
    for (let i = 0; i < 16 && !active; i++) if (hit(layer, b0 + i)) active = true;
    text(lab, 8, y, active ? (pulse(layer, t, 8) > 0.4 || held ? P.fg : col) : P.edge);
    for (let i = 0; i < 16; i++) {
      const on = hit(layer, b0 + i), x = 22 + i * 9;
      cx.fillStyle = on ? (i === cur ? P.white : col) : held ? dark : active ? P.grid : '#0e0c22';
      cx.fillRect(x, y, 8, 5);
    }
  });
  cx.fillStyle = P.fg; cx.fillRect(22 + cur * 9, y0 + 55, 8, 1); // playhead
}

// ---------- scenes ----------
const NEB = Array.from({ length: 240 }, () => ({ r: 14 + rng() * 84, a: rng() * 6.283, c: rng(), s: rng() }));
const BLOBS = Array.from({ length: 7 }, () => ({ x: 20 + rng() * 140, y: 50 + rng() * 130, r: 14 + rng() * 18 | 0, c: rng() }));
const DISK = Array.from({ length: 170 }, () => ({ r: rng() * 66, a: rng() * 6.283, c: rng() }));

function sceneTitle(lt, t, ctl) {
  stars(t);
  sun(90, 160, 26, SUN_Y, t, 0.3 + 0.15 * Math.sin(t * 3));
  card([{ t: 'LIFE OF', s: 3 }, { t: 'A SUN', s: 3, c: P.kick }, { t: `HARDCORE MIX - ${BPM} BPM`, c: P.dim }], 34);
  text('6 LAYERS. 1 STAR. 1 DROP.', 90, 208, P.dim, 1, 'c');
  const on = ((performance.now() / 500) | 0) % 2 === 0;
  if (!ctl.started) {
    if (on) card([{ t: 'TAP TO START', c: P.kick, s: 2 }], 250);
    text('BASS HEAVY: TURN IT UP', 90, 290, P.edge, 1, 'c');
  } else if (on) card([{ t: 'FROM DUST TO DROP', c: P.kick }], 250);
}

function sceneNebula(lt, t, sec) {
  stars(t);
  const p = lt / secDur(sec), bf = (t % BAR) / BAR, glow = 0.6 + 0.4 * Math.sin(Math.PI * bf), ce = pulse('clank', t, 7);
  for (const b of BLOBS) {
    const x = Math.round(b.x + (90 - b.x) * p * 0.6), y = Math.round(b.y + (112 - b.y) * p * 0.6);
    ditherCircle(x, y, 0, b.r, b.c < 0.5 ? P.droneD : P.nebD, 0.14 + 0.14 * glow);
  }
  const squash = 0.85 - 0.35 * p;
  for (const n of NEB) {
    const r = n.r * (1 - 0.7 * p ** 1.5), a = n.a + lt * 2.2 / (r / 10 + 2);
    const x = Math.round(90 + Math.cos(a) * r), y = Math.round(112 + Math.sin(a) * r * squash);
    const spark = n.s < 0.12 && ce > 0.3;
    cx.fillStyle = spark ? P.white : n.c < 0.5 ? P.drone : n.c < 0.82 ? P.neb : P.dim;
    cx.fillRect(x, y, spark ? 2 : 1, spark ? 2 : 1);
  }
  ditherCircle(90, 112, 0, Math.round(4 + p * 14), P.bass, p * 0.6);
  banner('1. NEBULA', 'LAYER 1: INDUSTRIAL DRONE', P.drone);
  fact(lb(lt) < 4 ? ['A COLD CLOUD OF GAS + DUST', { t: `ABOUT ${STAR.cloudC} C`, c: P.cool }]
                  : ['GRAVITY PULLS IT TOGETHER', { t: 'THE CENTRE CLUMPS + HEATS', c: P.bass }], P.drone);
  timeline(perBeat(STAR.nebulaYrs, sec.bars));
}
const lb = lt => Math.floor(lt / BAR);

function sceneProto(lt, t, sec) {
  stars(t);
  const ign = IGNITE_BAR * BAR, lit = lt >= ign, dur = secDur(sec), ke = pulse('kick', t, 9);
  const T = lit ? STAR.igniteK + (STAR.coreNowK - STAR.igniteK) * (lt - ign) / (dur - ign)
                : 1e6 * Math.pow(STAR.igniteK / 1e6, lt / ign);
  const X = 90, Y = 112;
  const disk = front => {
    for (const d of DISK) {
      const r = 12 + ((d.r - lt * 5 + 660) % 66), a = d.a + lt * 80 / r ** 1.5;
      if ((Math.sin(a) > 0) !== front) continue;
      const x = Math.round(X + Math.cos(a) * r), y = Math.round(Y + Math.sin(a) * r * 0.3);
      cx.fillStyle = r < 26 ? P.kick : r < 46 ? P.bass : d.c < 0.5 ? P.lead : P.droneD;
      const big = r < 30 && ke > 0.5;
      cx.fillRect(x, y, big ? 2 : 1, big ? 2 : 1);
    }
  };
  disk(false);
  const dk = since('kick', t);
  if (dk < 0.45) ring(X, Y, 8 + dk * 130, lit ? P.kick : P.bass, 2, 1 - dk / 0.45);
  if (lit) {
    for (const dir of [-1, 1]) for (let d = 8; d < 70; d++) for (let w = -2; w <= 2; w++) {
      const px = X + w + Math.round(Math.sin(d * 0.3 + t * 9) * 0.6), py = Y + dir * d;
      if (bay(px, py) < (1 - d / 70) * 16 * (0.45 + 0.55 * ke) * (1 - Math.abs(w) * 0.25)) { cx.fillStyle = Math.abs(w) < 1 ? P.white : P.perc; cx.fillRect(px, py, 1, 1); }
    }
  }
  const r = 5 + 6 * Math.min(1, lt / ign) + 3 * ke;
  sun(X, Y, r, T < 4e6 ? SUN_R : T < STAR.igniteK ? SUN_O : SUN_Y, t, 0.25 + 0.5 * ke);
  disk(true);
  if (lit && lt < ign + 0.6) {
    const f = 1 - (lt - ign) / 0.6;
    ditherFill(P.white, (CALM ? 0.3 : 0.8) * f);
    card([{ t: 'FUSION!', s: 3, c: P.kick }], 60);
  }
  banner('2. PROTOSTAR', 'LAYER 2: DISTORTED KICK', P.kick);
  fact(lit ? [{ t: `CORE: ${fmtK(T)}`, c: P.kick }, 'HYDROGEN STARTS TO FUSE', { t: 'A STAR IS BORN', c: P.kick }]
           : [{ t: `CORE: ${fmtK(T)}`, c: T < 4e6 ? P.lead : P.bass }, 'GRAVITY SQUEEZES + HEATS IT', `FUSION NEEDS ${fmtK(STAR.igniteK)}`], P.kick);
  timeline(perBeat(STAR.protoYrs, sec.bars));
}

function sceneMain(lt, t, sec) {
  stars(t);
  const ke = pulse('kick', t, 9), be = pulse('bass', t, 14), half = lb(lt) >= 4, X = 90, Y = 104, R = 32;
  sun(X, Y, R + Math.round(be), SUN_Y, t, 0.25 + 0.3 * be);
  fillCircle(X, Y, 5, P.white);
  const s = Math.floor(t / STEP);
  if (be > 0.4) for (let k = 0; k < 5; k++) { const a = hash(s * 5 + k) * 6.283, d = 3 + hash(s + k * 9) * 6; cx.fillStyle = P.bass; cx.fillRect(Math.round(X + Math.cos(a) * d), Math.round(Y + Math.sin(a) * d), 1, 1); }
  for (const k of [1, 3, 5, 7]) {   // pressure pushing out = the rolling bass
    const a = k * Math.PI / 4, r0 = R + 5, r1 = R + 14 + be * 6;
    arrow(X + Math.cos(a) * r0, Y + Math.sin(a) * r0, X + Math.cos(a) * r1, Y + Math.sin(a) * r1, P.bass);
  }
  for (const k of [0, 2, 4, 6]) {   // gravity pulling in = the kick
    const a = k * Math.PI / 4, push = half ? ke * 4 : 0, r0 = R + 26 - push, r1 = R + 7 - push;
    arrow(X + Math.cos(a) * r0, Y + Math.sin(a) * r0, X + Math.cos(a) * r1, Y + Math.sin(a) * r1, half ? P.grav : P.edge);
  }
  text('GRAVITY', X + 6, Y - R - 22, half ? P.grav : P.edge);
  text('PRESSURE', X + R - 6, Y + R + 12, P.bass);
  // age bar, with the Sun today marked
  const age = STAR.mainYrs * lt / secDur(sec), bx = 30, bw = 120, nx = bx + Math.round(bw * STAR.nowYrs / STAR.mainYrs);
  cx.fillStyle = P.grid; cx.fillRect(bx, 176, bw, 3);
  cx.fillStyle = P.kick; cx.fillRect(bx, 176, Math.round(bw * age / STAR.mainYrs), 3);
  cx.fillStyle = P.fg; cx.fillRect(nx, 174, 1, 7);
  if (age >= STAR.nowYrs) text('NOW', nx, 168, ((t * 4) | 0) % 2 ? P.fg : P.kick, 1, 'c');
  text(`AGE: ${fmtYears(age)} YRS`, 90, 184, P.dim, 1, 'c');
  banner('3. MAIN SEQUENCE', 'LAYER 3: RUMBLE BASS', P.bass);
  fact(half ? [{ t: 'KICK = GRAVITY PULLING IN', c: P.grav }, 'IN + OUT IN BALANCE', { t: `STABLE ~${fmtYears(STAR.mainYrs)} YRS`, c: P.kick }]
            : ['HYDROGEN FUSES TO HELIUM', { t: 'BASS = ENERGY PUSHING OUT', c: P.bass }], P.bass);
  timeline(perBeat(STAR.mainYrs, sec.bars));
}

function sceneGiant(lt, t, sec) {
  stars(t);
  const dur = secDur(sec), grow = dur * 0.88, p = Math.min(1, lt / grow), AU = 74, X = 90, Y = 116;
  const R0 = STAR.sunAU * AU, R = R0 * Math.pow(GIANT, p), le = pulse('lead', t, 6), f = R / R0;
  for (const [, a] of STAR.planets) ring(X, Y, a * AU, P.edge, 1, 0.35);
  sun(X, Y, R > 10 ? R + le * 1.5 : R, f < 8 ? SUN_Y : f < 40 ? SUN_O : SUN_R, t, 0.22 + 0.35 * le);
  const gone = [];
  for (const [name, a, per, col] of STAR.planets) {
    const pE = Math.log(a / STAR.sunAU) / Math.log(GIANT), tE = pE * grow; // when the surface reaches this orbit
    const ang = 1.3 + lt * 1.4 / per, px = Math.round(X + Math.cos(ang) * a * AU), py = Math.round(Y + Math.sin(ang) * a * AU);
    if (pE > 1 || lt < tE) {
      fillCircle(px, py, name === 'MERCURY' ? 1 : 2, col);
      text(name, px + (px > X ? 4 : -4), py < 60 ? py + 4 : py - 7, col, 1, px > X ? 'l' : 'r');
    } else {
      gone.push(name);
      if (lt - tE < 0.6) ditherCircle(px, py, 0, 3 + Math.round((lt - tE) * 20), P.white, 1 - (lt - tE) / 0.6);
    }
  }
  text('ORBITS TO SCALE. PLANETS NOT.', 90, 34, P.edge, 1, 'c');
  banner('4. RED GIANT', 'LAYER 4: HOOVER LEAD', P.lead);
  const lines = [p < 0.5 ? 'CORE HYDROGEN RUNS OUT' : 'SHELL BURNING SWELLS IT', { t: `SIZE: ${Math.round(f)}X TODAY`, c: P.lead }];
  if (gone.length) lines.push({ t: gone.join(' + ') + ': SWALLOWED', c: P.bass });
  if (lt > grow && !gone.includes('EARTH')) lines.push({ t: "EARTH'S FATE: UNCERTAIN", c: P.cool });
  fact(lines, P.lead);
  timeline(perBeat(STAR.giantYrs, sec.bars));
}

function sceneFlash(lt, t, sec) {
  const bar = lb(lt), beat = Math.floor((lt % BAR) / BEAT), build = 3.75 * BAR;
  if (bar === 3 && beat === 3) { // the silent beat before the drop
    fillCircle(90, 116, 2, P.white);
    ditherCircle(90, 116, 2, 8, P.perc, 0.5);
    text('HELIUM FLASH', 90, 150, P.white, 2, 'c');
    return;
  }
  stars(t);
  const se = pulse('snare', t, 16), p = Math.min(1, lt / build), X = 90, Y = 116;
  const T = STAR.coreNowK * 3 * Math.pow(STAR.heliumK / (STAR.coreNowK * 3), p);
  sun(X, Y, 64 + Math.round(se * 2), SUN_R, t, 0.2 + 0.3 * se);
  fillCircle(X, Y, 17, '#2a0610');
  ring(X, Y, 17, P.leadD, 1, 1);
  const cr = Math.round(3 + p * 3 + se * 3);
  for (let k = 0; k < 8; k++) {
    const a = k * Math.PI / 4 + t, len = cr + 2 + se * 12;
    line(X + Math.cos(a) * cr, Y + Math.sin(a) * cr, X + Math.cos(a) * len, Y + Math.sin(a) * len, P.perc, 0.75);
  }
  fillCircle(X, Y, cr, se > 0.5 ? P.white : P.hot);
  if (bar === 3) { const n = String(3 - beat); text(n, 92, 100, P.shadow, 6, 'c'); text(n, 90, 98, P.white, 6, 'c'); }
  banner('5. HELIUM FLASH', 'LAYER 5: SNARE ROLL', P.perc);
  fact([{ t: `CORE: ${fmtK(T)}`, c: P.perc }, `AT ${fmtK(STAR.heliumK)}`, 'HELIUM FUSES INTO CARBON'], P.perc);
  timeline('TIME: THE FLASH LASTS MINUTES');
  if (!CALM && se > 0.6 && p > 0.4) glitch(Math.floor(t / STEP), 2 + (p * 4 | 0));
}

function sceneDrop(lt, t, sec) {
  const bar = lb(lt), B = bar >= 8, X = 90, Y = 112, s = Math.floor(t / STEP), beatN = Math.floor(t / BEAT);
  const ke = pulse('kick', t, 8), ce = pulse('clap', t, 10), he = pulse('ohat', t, 14);
  warp(t, ke, X, Y);
  // a shell of gas thrown off on every kick
  for (let k = 0; k < 40; k++) {
    if (!hit('kick', s - k)) continue;
    const dt = t - (s - k) * STEP, r = 6 + dt * 80;
    if (r > 120) break;
    ring(X, Y, r, CYC[((s - k) >> 2) % CYC.length], 2, (B ? 0.55 : 1) * (1 - r / 120), B ? 0.75 : 1);
  }
  if (!B) {
    for (let k = 0; k < 12; k++) {
      const a = k * Math.PI / 6 + t * 0.5, len = 22 + 60 * ce;
      line(X + Math.cos(a) * 10, Y + Math.sin(a) * 10, X + Math.cos(a) * len, Y + Math.sin(a) * len, CYC[(k + beatN) % CYC.length], 0.5);
    }
    sun(X, Y, 4 + ke * 3, SUN_W, t, 0.6);
  } else {
    // ring nebula: violet inside, teal middle, red outside
    const n = 520;
    for (let k = 0; k < n; k++) {
      const a = k / n * 2 * Math.PI, wob = 0.6 + 0.4 * Math.sin(3 * a + t * 1.5);
      for (let dr = -10; dr <= 10; dr++) {
        const px = Math.round(X + Math.cos(a) * (58 + dr)), py = Math.round(Y + Math.sin(a) * (58 + dr) * 0.74);
        if (bay(px, py) < (1 - Math.abs(dr) / 11) * wob * (0.45 + 0.55 * ke) * 16) {
          cx.fillStyle = dr < -4 ? P.drone : dr <= 4 ? P.arp : P.lead; cx.fillRect(px, py, 1, 1);
        }
      }
    }
    const sp = 6 + 18 * ke;
    line(X - sp, Y, X + sp, Y, P.cool, 0.7); line(X, Y - sp, X, Y + sp, P.cool, 0.7);
    ditherCircle(X, Y, 2, 9 + Math.round(ke * 6), P.cool, 0.5);
    fillCircle(X, Y, 2, P.white);
    for (let k = 0; k < 6; k++) { // arp notes orbit the white dwarf
      const m = hit('arp', s - k);
      if (!m) continue;
      const a = (m % 12) / 12 * 2 * Math.PI + t, r = 18 + (m % 24 >= 12 ? 6 : 0);
      cx.fillStyle = k === 0 ? P.white : P.arp;
      cx.fillRect(Math.round(X + Math.cos(a) * r), Math.round(Y + Math.sin(a) * r * 0.74), k === 0 ? 2 : 1, k === 0 ? 2 : 1);
    }
  }
  if (!CALM) ditherFill(CYC[beatN % CYC.length], 0.13 * ke);
  const subCol = CYC[beatN % CYC.length];
  banner(B ? '7. WHITE DWARF' : '6. PLANETARY NEBULA', 'ALL LAYERS: THE DROP!', subCol, subCol);
  fact(B ? ['THE LEFTOVER CORE:', { t: "EARTH-SIZED, HALF THE SUN'S MASS", c: P.cool }, { t: '1 TEASPOON WEIGHS ~5 TONNES', c: P.arp }]
         : ['OUTER LAYERS BLOWN AWAY', { t: 'GLOWING SHELLS OF GAS', c: P.arp }, { t: 'CARBON FOR NEW STARS', c: P.lead }], subCol);
  timeline(B ? perBeat(STAR.wdYrs, 8) : perBeat(STAR.pnYrs, 8));
  if (!CALM && ce > 0.5) glitch(s, 3);
}

function sceneOutro(lt, t, sec) {
  stars(t);
  const p = lt / secDur(sec);
  ring(90, 112, 58, P.droneD, 6, 0.25 * (1 - p), 0.74);
  const pal = p < 0.3 ? SUN_W : p < 0.55 ? [P.grav, P.cool, '#bcd4ff', '#bcd4ff'] : p < 0.8 ? [P.leadD, P.leadD, P.lead, P.lead] : [P.grid, P.grid, P.edge, P.edge];
  sun(90, 112, 3, pal, t, 0.45 * (1 - p));
  banner('8. BLACK DWARF?', 'LAYER 1 AGAIN: DRONE', P.drone);
  fact(['IT COOLS FOR TRILLIONS OF YRS', { t: 'TOO SLOW: NONE HAS', c: P.dim }, { t: 'FADED TO BLACK YET', c: P.dim }], P.drone);
  text('TIME HUGELY COMPRESSED', 90, 238, P.edge, 1, 'c');
  text('SIZES NOT TO SCALE EXCEPT ORBITS', 90, 246, P.edge, 1, 'c');
}

const SCENES = { title: sceneTitle, nebula: sceneNebula, proto: sceneProto, main: sceneMain, giant: sceneGiant, flash: sceneFlash, drop: sceneDrop, outro: sceneOutro };

// ---------- main loop ----------
function frame() {
  const started = !!ac;
  let tau = 0;
  if (started) tau = Math.max(0, ac.currentTime - T0 - (ac.outputLatency || 0));
  else if (DEBUG_T !== null) tau = DEBUG_T;
  const t = tau % LOOP;
  const bar = Math.floor(t / BAR), sec = SONG[BAR_SEC[bar]], lt = t - sec.start * BAR;
  const showing = started || DEBUG_T !== null;

  cx.setTransform(1, 0, 0, 1, 0, 0);
  cx.fillStyle = P.bg; cx.fillRect(0, 0, W, H);
  if (!showing) { sceneTitle(0, performance.now() / 1000, { started }); requestAnimationFrame(frame); return; }

  const ke = pulse('kick', t, 12);
  if (!CALM && sec.id === 'drop' && ke > 0.3) {
    const s = Math.floor(t / STEP);
    cx.setTransform(1, 0, 0, 1, Math.round((hash(s) - 0.5) * 6 * ke), Math.round((hash(s + 99) - 0.5) * 6 * ke));
  }
  if (sec.id === 'title') sceneTitle(lt, t, { started: true });
  else SCENES[sec.id](lt, t, sec);
  cx.setTransform(1, 0, 0, 1, 0, 0);
  if (sec.id !== 'title') hud(t);

  if (lt < 0.3 && sec.id !== 'drop' && sec.k > 0) ditherFill(P.bg, 1 - lt / 0.3);
  if (sec.id === 'drop' && lt < 0.25 && !CALM) ditherFill(P.white, 0.7 * (1 - lt / 0.25));
  if (started && ac.state === 'suspended') card([{ t: 'PAUSED', c: P.kick, s: 2 }], 150);
  requestAnimationFrame(frame);
}
frame();
})();
</script>
