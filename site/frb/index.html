<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fast Radio Burst: Goa Trance Mix</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="stylesheet" href="../engine/engine.css">
</head>
<body>
<canvas id="c" width="180" height="320"></canvas>
<p>click / space: play-pause &middot; m: mute &middot; headphones + volume up &middot; ?bpm=140 &amp;ms=1 &amp;yrs=80 &amp;dm=500 (pc/cm&sup3;) &amp;gly=3 &amp;calm=1 (no shake/flash)</p>
<script src="../engine/engine.js"></script>
<script>
(() => {
'use strict';

// ---------- config ----------
const { W, H } = Engine;
const { num, CALM, SHORT } = Engine.params;
const BPM = num('bpm', 140, 130, 150);

// A bright fast radio burst. Every number drawn on screen or heard comes from these.
const FRB = {
  ms: num('ms', 1, 0.1, 10),              // burst width
  yrs: num('yrs', 80, 1, 1000),           // its energy = the Sun's total output over this many years
  dm: num('dm', 500, 100, 600),           // dispersion measure, pc/cm^3: how many electrons it crossed
  gly: num('gly', 3, 0.5, 8),             // distance, billion light years
  fHi: 800, fLo: 400,                     // CHIME telescope band, MHz
  perDay: 1000,                           // rough all-sky rate estimate
  magKm: 20, bMagT: 1e10,                 // magnetar: diameter, magnetic field (tesla)
};
const L_SUN = 3.828e26, SEC_YR = 3.156e7, C_KMS = 299792, K_DM = 4.148808e-3, B_EARTH = 5e-5, BLINK_MS = 100;
const E_J = L_SUN * FRB.yrs * SEC_YR;                  // joules
const POWER_W = E_J / (FRB.ms / 1000);
const SUNS = POWER_W / L_SUN;
const SIZE_KM = C_KMS * FRB.ms / 1000;                 // light-travel limit on the source's size
const B_RATIO = FRB.bMagT / B_EARTH;
// dispersion: seconds a frequency (MHz) arrives behind the top of the band, and its inverse
const delay = f => K_DM * FRB.dm * ((1000 / f) ** 2 - (1000 / FRB.fHi) ** 2);
const fAt = s => 1000 / Math.sqrt(s / (K_DM * FRB.dm) + (1000 / FRB.fHi) ** 2);
const SWEEP = delay(FRB.fLo);
const SHIFT = 1e6;                                     // radio shifted down this much to be heard
const heard = mhz => mhz * 1e6 / SHIFT;                // Hz

const X = 90, Y = 112;

// the track: one section per stage, each introducing one layer
const SONG = [
  { id: 'title', bars: 2 },
  { id: 'pulse', bars: 8 },     // layer 1: 4/4 kick
  { id: 'power', bars: 8 },     // layer 2: rolling goa bass
  { id: 'journey', bars: 8 },   // layer 3: acid lead
  { id: 'detector', bars: 8 },  // layer 4: hats + clap, and the real-speed dispersion sweep
  { id: 'source', bars: 8 },    // layer 5: pulse arp
  { id: 'ignite', bars: 4 },    // build: snare roll, riser, filter sweep
  { id: 'drop', bars: 32 },     // everything: warp, host galaxy, whole sky, repeaters
  { id: 'outro', bars: 4 },     // acid alone, filter closing
];
const clock = Engine.clock(BPM, SONG);
const { STEP, BAR, BEAT, BAR_SEC, LOOP, at, secDur, lb } = clock;
const SWEEP_LEN = Math.min(SWEEP, 7 * BAR - 0.2);      // must end inside the detector section

// E phrygian: E E F G
const ROOT = [40, 40, 41, 43];
const riff = o => Array.from({ length: 16 }, (_, i) => o[i] || 0);
const ACID = [[52, 0, 64, 52, 55, 52, 53, 0, 52, 64, 0, 59, 52, 55, 53, 64],
              [52, 0, 64, 52, 55, 52, 53, 0, 52, 64, 0, 62, 60, 59, 55, 53],
              [53, 0, 65, 53, 57, 53, 55, 0, 53, 65, 0, 60, 53, 57, 55, 65],
              [55, 0, 67, 55, 59, 55, 57, 0, 55, 67, 0, 62, 64, 62, 59, 55]];
const HI = [riff({ 0: 76, 3: 74, 6: 72, 8: 71, 10: 72, 12: 74, 14: 71 }), riff({ 0: 76, 3: 77, 6: 76, 8: 74, 10: 72, 12: 71, 14: 72 }),
            riff({ 0: 77, 3: 76, 6: 72, 8: 69, 10: 72, 12: 77 }), riff({ 0: 79, 3: 77, 6: 74, 8: 71, 10: 74, 12: 79, 14: 83 })];
const ARPC = [[64, 67, 71], [64, 67, 71], [65, 69, 72], [67, 71, 74]];
const ARPI = [0, 1, 2, 3, 4, 3, 2, 1, 0, 2, 4, 5, 4, 2, 3, 1];   // index into chord tones over two octaves
const BASSN = [-1, 0, 0, 0, -1, 0, 0, 0, -1, 0, 0, 0, -1, 0, 12, 0]; // goa roll: kick, bass, bass, bass
const arpTone = (ch, k) => ARPC[ch][k % 3] + 12 * Math.floor(k / 3) + 12;

// the silent beat before the drop
const hushAt = s => { const { id, lb, i } = at(s); return id === 'ignite' && lb === 3 && i >= 12; };

// single source of truth for what plays on step s: audio, HUD and visuals all read this
function hit(layer, s) {
  const { id, lb, i } = at(s), ch = lb % 4, D = id === 'drop', e8 = lb % 8, part = lb >> 3;
  const roll = D && e8 === 7 && i >= 12 && lb !== 31;  // snare roll into the next 8
  const hush = hushAt(s);
  const groove = id === 'journey' || id === 'detector' || id === 'source';
  const sweeping = id === 'detector' && lb >= 1 && lb < 7;   // the lead keeps clear of the whistle
  switch (layer) {
    case 'kick':
      if (id === 'pulse') return lb < 2 ? (i === 0 ? 1 : 0) : i % 4 === 0 ? 1 : 0;
      if (id === 'power' || groove) return i % 4 === 0 ? 1 : 0;
      if (id === 'ignite') return lb < 2 && i % 4 === 0 ? 1 : 0;
      if (D) return !roll && i % 4 === 0 ? 1 : 0;
      if (id === 'outro') return lb === 0 && i === 0 ? 1 : 0;
      return 0;
    case 'bass':
      if (id === 'power' && lb < 2) return i % 4 === 2 ? ROOT[ch] : 0;
      if (id === 'power' || groove || (id === 'ignite' && lb < 2) || (D && !roll)) return BASSN[i] >= 0 ? ROOT[ch] + BASSN[i] : 0;
      return 0;
    case 'acid':
      if (id === 'journey') return lb < 2 && i % 4 ? 0 : ACID[ch][i];
      if (id === 'detector') return sweeping ? 0 : ACID[ch][i];
      if (id === 'source' || D || id === 'outro') return ACID[ch][i];
      if (id === 'ignite') return hush ? 0 : ACID[ch][i];
      return 0;
    case 'hi': return D && (part === 1 || part === 3) ? HI[ch][i] : 0;
    case 'hat':   // 1 = open off-beat, less = closed 16th
      if (id === 'detector' && lb < 2) return i % 4 === 2 ? 1 : 0;
      if (id === 'detector' || id === 'source' || (id === 'ignite' && lb < 2) || (D && !roll)) return i % 4 === 2 ? 1 : 0.45;
      return 0;
    case 'clap': return ((id === 'detector' && lb >= 4) || id === 'source' || (id === 'ignite' && lb < 2) || (D && !roll)) && (i === 4 || i === 12) ? 1 : 0;
    case 'snare':
      if (id === 'ignite' && lb >= 2) {
        if (hush) return 0;
        const v = 0.4 + 0.6 * ((lb - 2) * 16 + i) / 28;
        return lb === 2 && i % 2 ? 0 : v;
      }
      return roll ? 0.6 + 0.13 * (i - 12) : 0;
    case 'arp':
      if (id === 'source') return lb < 4 && i % 2 ? 0 : arpTone(ch, ARPI[i]);
      if (id === 'ignite') return hush ? 0 : arpTone(ch, ARPI[i]);
      if (D) return arpTone(ch, ARPI[i]);
      return 0;
    case 'zap': return i === 14 && lb % 2 === 1 && !roll && (D || (id === 'source' && lb >= 4)) ? 1 : 0;
    case 'sweep': return id === 'detector' && lb === 1 && i === 0 ? 1 : 0;
    case 'crash': return i === 0 && ((D && e8 === 0) || (id === 'outro' && lb === 0)) ? 1 : 0;
    case 'lead': return hit('acid', s) || hit('hi', s);
    case 'perc': return hit('hat', s) || hit('clap', s) || hit('snare', s);
    case 'fx': return hit('crash', s) || hit('zap', s) || hit('sweep', s);
  }
  return 0;
}
const { pulse, last, countdown, sequencer } = Engine.envelopes(hit, clock);

// how far the acid filter is open, 0..1: read by the audio and the meter.
// Shut at the start, opening per section, swept wide in the build, twisted slowly up and down in each drop part.
const OPEN = { title: [0.3, 0.3], pulse: [0.2, 0.2], power: [0.2, 0.2], journey: [0.05, 0.4], detector: [0.4, 0.5], source: [0.5, 0.65], outro: [0.9, 0.05] };
function leadOpen(s) {
  const { sec, id, lb, i } = at(s), x = (lb * 16 + i) / (sec.bars * 16);
  if (id === 'ignite') return 0.65 + 0.35 * Math.min(1, (lb * 16 + i) / 60);
  if (id === 'drop') {
    const e8 = lb % 8;
    if (e8 === 7 && lb !== 31) return 0.95 - 0.5 * i / 15;
    return 0.5 + 0.45 * (0.5 - 0.5 * Math.cos(2 * Math.PI * (e8 * 16 + i) / 112));
  }
  const [a, b] = OPEN[id];
  return a + (b - a) * x;
}
const cutoff = o => 150 * Math.pow(5000 / 150, o);   // Hz

// each instrument wears one colour for the whole video
const P = {
  ...Engine.NEUTRALS,
  kick: '#ffe14a', kickD: '#5e4c10', kickL: '#fff4b0',    // the burst itself
  bass: '#ff3ad0', bassD: '#4e0e40', bassL: '#ff9aea',    // energy
  lead: '#7dff3a', leadD: '#1f4a10', leadL: '#d4ffb4',    // the radio wave
  hat: '#3ae8ff', hatD: '#0c3c48', hatL: '#b0f6ff',       // the telescope
  arp: '#a46aff', arpD: '#2e1a5e', arpL: '#dccaff',       // the magnetar
  fx: '#ff8a2a', fxD: '#5e2c0c',
  earth: '#3a8aff',
};
const SUNP = ['#ffd23f', '#c07010', '#ffc030', '#fff4b0'];
const MAG = [P.arpL, '#6aa8ff', '#dbe9ff', P.white];
const CYC = [P.kick, P.bass, P.lead, P.hat, P.arp, P.fx];
const CYCD = [P.kickD, P.bassD, P.leadD, P.hatD, P.arpD, P.fxD];
const cyc = n => CYC[((n % 6) + 6) % 6];

// ---------- canvas + gfx helpers ----------
const { cx, text, card, bay, fillCircle, ditherCircle, dEllipse, ring, line, dot, ditherFill, sun, banner, fact, timeline } = Engine.gfx(P);
const { mulberry, hash } = Engine.rand;
const rng = mulberry(121102);

const STARS = Array.from({ length: 140 }, () => ({ x: rng() * W | 0, y: rng() * H | 0, b: rng() }));
const starCol = (k, t, s) => (k * 7 + Math.floor(t * 6)) % 11 === 0 ? P.fg : s.b > 0.6 ? P.dim : P.edge;
function stars(t) {
  STARS.forEach((s, k) => { cx.fillStyle = starCol(k, t, s); cx.fillRect(s.x, s.y, 1, 1); });
}

// ---------- the actors ----------
// the burst: a yellow flash with diffraction spikes, e = 0..1
function burstFlash(x, y, e) {
  if (e < 0.02) return;
  x = Math.round(x); y = Math.round(y);
  ditherCircle(x, y, 0, 3 + e * 14, P.kick, 0.7 * e);
  ditherCircle(x, y, 0, 2 + e * 5, P.kickL, e);
  const L = Math.round(4 + 12 * e);
  line(x - L, y, x + L, y, P.white, e); line(x, y - L, x, y + L, P.white, e);
  cx.fillStyle = P.white; cx.fillRect(x, y, 1, 1);
}

// two-armed spiral galaxy seen at a tilt; returns the burst site on one arm
function galaxy(x, y, r, rot, tilt = 0.5, d = 1, pal = [P.arpD, P.arp, P.bassL]) {
  dEllipse(x, y, r * 1.05, r * 1.05 * tilt, 0, pal[0], 0.3 * d);
  for (let arm = 0; arm < 2; arm++) {
    for (let k = 0; k < 160; k++) {
      const u = k / 160;
      for (let j = 0; j < 3; j++) {
        const h = hash(k * 7 + arm * 991 + j * 31) - 0.5, a = rot + arm * Math.PI + u * 4.2 + h * 0.35, rr = r * (0.12 + 0.88 * u) * (1 + h * 0.12);
        dot(x + Math.cos(a) * rr, y + Math.sin(a) * rr * tilt, u < 0.3 ? pal[2] : pal[1], d * (1 - 0.5 * u));
      }
    }
  }
  dEllipse(x, y, r * 0.22, r * 0.22 * tilt + 1, 0, pal[2], 0.8 * d);
  cx.fillStyle = P.white; cx.fillRect(Math.round(x), Math.round(y), 1, 1);
  const sa = rot + 0.7 * 4.2, sr = r * (0.12 + 0.88 * 0.7);
  return { x: Math.round(x + Math.cos(sa) * sr), y: Math.round(y + Math.sin(sa) * sr * tilt) };
}

const MAG_LS = [16, 28, 42, 58];
// magnetar: a spinning neutron star in a dipole field (field lines r = L sin^2 th), sparks running along them
function magnetar(x, y, t, s, o = {}) {
  const spin = o.spin ?? t * 0.8, d = o.d ?? 1, Ls = o.Ls ?? MAG_LS;
  const ax = -Math.PI / 2 + 0.5 * Math.sin(spin), sp = 0.35 + 0.65 * Math.abs(Math.cos(spin)), ca = Math.cos(ax), sa = Math.sin(ax);
  const pt = (L, th, side) => { const r = L * Math.sin(th) ** 2, u = r * Math.cos(th), v = side * r * Math.sin(th) * sp; return [x + u * ca - v * sa, y + u * sa + v * ca]; };
  Ls.forEach((L, li) => {
    const n = Math.round(L * 3);
    for (const side of [-1, 1]) for (let k = 1; k < n; k++) { const [px, py] = pt(L, k / n * Math.PI, side); dot(px, py, li % 2 ? P.arp : P.arpL, d * (li % 2 ? 0.9 : 0.6)); }
  });
  // one spark per arp note, sliding pole to pole
  for (let k = 0; k < 8; k++) {
    const st = s - k;
    if (!hit('arp', st)) continue;
    const u = (t - st * STEP) / (STEP * 6);
    if (u > 1) continue;
    const L = Ls[(hash(st * 5) * Ls.length) | 0], side = hash(st * 9) < 0.5 ? -1 : 1;
    const [px, py] = pt(L, 0.2 + u * (Math.PI - 0.4), side);
    cx.fillStyle = k === 0 ? P.white : P.arpL; cx.fillRect(Math.round(px), Math.round(py), 2, 2);
  }
  // beams out of the poles on every kick
  const ke = pulse('kick', t, 10) * d;
  if (ke > 0.05) for (const sg of [-1, 1]) line(x + ca * sg * 6, y + sa * sg * 6, x + ca * sg * (14 + 40 * ke), y + sa * sg * (14 + 40 * ke), P.kick, ke);
  sun(x, y, 5, MAG, t, 0.6 * d);
}

// expanding radio shells, one per kick
function kickShells(t, s, x0, y0, col) {
  for (let k = 0; k < 40; k++) {
    if (!hit('kick', s - k)) continue;
    const r = 6 + (t - (s - k) * STEP) * 90;
    if (r > 140) break;
    ring(x0, y0, r, col || cyc((s - k) >> 2), 1, 0.6 * (1 - r / 140));
  }
}

// psychedelic backdrop: slowly turning spiral spokes in the dark instrument colours
function tunnel(t, d) {
  for (let k = 0; k < 10; k++) {
    const a0 = k / 10 * 6.283 + t * 0.35, col = CYCD[k % 6];
    for (let r = 14; r < 150; r += 2) { const a = a0 + r * 0.025; dot(X + Math.cos(a) * r, Y + Math.sin(a) * r * 1.1, col, d); }
  }
}

// flying through a starfield: z 1 = far, 0 = at the camera
const WARP = Array.from({ length: 110 }, () => ({ a: rng() * 6.283, z: rng(), c: (rng() * 6) | 0 }));
function warp(t, speed, len) {
  for (const w of WARP) {
    const z = ((w.z - t * speed) % 1 + 1) % 1, r0 = 4 / (z + 0.04), r1 = 4 / (z + 0.04 + len);
    if (r1 > 200) continue;
    const c = Math.cos(w.a), sn = Math.sin(w.a);
    line(X + c * r1, Y + sn * r1, X + c * Math.min(r0, 200), Y + sn * Math.min(r0, 200), z < 0.3 ? CYC[w.c] : P.dim);
  }
}

// ---------- text helpers ----------
const { fmtNum, fmtBig, rough } = Engine.fmt;
const sci = v => { const e = Math.floor(Math.log10(v)); return `${fmtNum(v / 10 ** e)}X10^${e}`; };

// ---------- audio (everything synthesised) ----------
const { ctx, midi, track, G, F, chain, pan, warm, osc, env, play, noise, noiseSource } = Engine.audio;
let master, secGain, comp, duck, kickIn, bassIn, leadIn, hiIn, arpIn, percIn, fxSend;

function buildGraph(ac, out) {
  master = out;
  comp = ac.createDynamicsCompressor();
  comp.threshold.value = -14; comp.knee.value = 6; comp.ratio.value = 5; comp.attack.value = 0.003; comp.release.value = 0.12;
  secGain = G(0.78); // section level: the drop gets the headroom
  chain(comp, secGain, master);
  // sidechain bus: leads and arp pump against the kick
  duck = G(1); duck.connect(comp);
  // ping-pong echo, dotted eighth, each side darker than the last
  const dl = ac.createDelay(1), dr = ac.createDelay(1);
  dl.delayTime.value = dr.delayTime.value = STEP * 3;
  const fbl = G(0.4), fbr = G(0.4), lpl = F('lowpass', 3200), lpr = F('lowpass', 2600);
  fxSend = G(1);
  const merge = ac.createChannelMerger(2);
  chain(fxSend, dl, lpl, fbl, dr, lpr, fbr, dl);
  lpl.connect(merge, 0, 0); lpr.connect(merge, 0, 1);
  chain(merge, G(0.5), comp);
  kickIn = G(1);
  chain(kickIn, warm(2), F('lowpass', 9000), G(0.85), comp);
  bassIn = G(1);
  chain(bassIn, warm(1.6), F('lowpass', 1800), G(0.42), comp);
  leadIn = G(1);
  chain(leadIn, warm(2), G(0.38), duck);
  leadIn.connect(G(0.22)).connect(fxSend);
  hiIn = G(1);
  chain(hiIn, G(0.36), duck);
  hiIn.connect(G(0.45)).connect(fxSend);
  arpIn = G(1);
  chain(arpIn, G(0.34), duck);
  arpIn.connect(G(0.35)).connect(fxSend);
  percIn = G(0.8); percIn.connect(comp);
}

// THE TEACHING SIGNAL: one pure sine following the real dispersion curve, 800 -> 400 MHz heard as 800 -> 400 Hz,
// at real speed, straight to the master (no compressor, no echo, no section gain)
const SWEEP_VOL = 0.22;
function sweep(t) {
  const n = 512, c = new Float32Array(n);
  for (let k = 0; k < n; k++) c[k] = heard(fAt(k / (n - 1) * SWEEP_LEN));
  const o = track(ctx().createOscillator()), g = G(1);
  o.frequency.value = c[0];
  o.frequency.setValueCurveAtTime(c, t, SWEEP_LEN);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(SWEEP_VOL, t + 0.01);
  g.gain.setValueAtTime(SWEEP_VOL, t + SWEEP_LEN - 0.25); g.gain.linearRampToValueAtTime(0.0001, t + SWEEP_LEN);
  chain(o, g, master); play(o, t, SWEEP_LEN);
}

// psy kick: a fast pitch dive onto E1, over before the bass's first sixteenth; ducks the melodic bus
const KICK_NOTE = 28;
function kick(t, vel) {
  const o = osc('sine', 240, t);
  o.frequency.exponentialRampToValueAtTime(midi(KICK_NOTE) * 1.8, t + 0.018);
  o.frequency.exponentialRampToValueAtTime(midi(KICK_NOTE), t + 0.08);
  const g = G(1); env(g, t, vel, 0.001, STEP * 0.95, 0.5);
  chain(o, g, kickIn); play(o, t, STEP);
  const c = osc(0.5, 2400, t), cg = G(1); env(cg, t, vel * 0.18, 0.0005, 0.008);
  chain(c, cg, kickIn); play(c, t, 0.01);
  duck.gain.setValueAtTime(0.45, t);
  duck.gain.setTargetAtTime(1, t + 0.03, 0.05);
}

// sub boom on the big downbeats
const impact = t => Engine.audio.impact(t, kickIn);

// rolling goa bass: a 25% pulse plucked through a closing lowpass, over a triangle body
function rollBass(t, m, vel) {
  const f = midi(m), dur = STEP * 0.85, lp = F('lowpass', 900, 3), g = G(1);
  lp.frequency.setValueAtTime(1300, t); lp.frequency.exponentialRampToValueAtTime(260, t + dur);
  env(g, t, vel, 0.002, dur, 0.25);
  chain(lp, g, bassIn);
  const a = osc(0.25, f, t); chain(a, G(0.55), lp); play(a, t, dur);
  const b = osc('triangle', f, t); chain(b, G(0.9), g); play(b, t, dur);
}

// the acid line: two pulses through a screaming resonant lowpass, plucked open and settling on leadOpen's cutoff
function acid(t, m, dur, o, acc) {
  const fc = cutoff(o), lp = F('lowpass', fc, 10 + 6 * o), g = G(1);
  lp.frequency.setValueAtTime(Math.min(fc * (acc ? 5 : 3), ctx().sampleRate * 0.45), t);
  lp.frequency.exponentialRampToValueAtTime(fc, t + Math.min(dur, 0.09));
  env(g, t, acc ? 1 : 0.7, 0.002, dur, 0.6);
  chain(lp, g, leadIn);
  for (const [w, det] of [[0.5, -5], [0.25, 5]]) { const x = osc(w, midi(m), t); x.detune.value = det; chain(x, G(0.5), lp); play(x, t, dur); }
}

// the drop's soaring lead: a 25% pulse with a late vibrato, washed in echo
function hiLead(t, m, dur) {
  const f = midi(m), lp = F('lowpass', 4200, 1), g = G(1);
  env(g, t, 0.9, 0.005, dur, 0.75);
  chain(lp, g, hiIn);
  const v = osc('sine', 5.5, t), vg = G(0);
  vg.gain.setValueAtTime(0, t); vg.gain.linearRampToValueAtTime(14, t + Math.min(dur, 0.3));
  for (const [w, det, a] of [[0.25, 0, 0.6], [0.5, 7, 0.4]]) {
    const x = osc(w, f, t); x.detune.value = det; chain(v, vg, x.detune); chain(x, G(a), lp); play(x, t, dur);
  }
  play(v, t, dur);
}

// chip snare: a dropping triangle body and a burst of noise, for the build rolls
function snare(t, vel) {
  const o = osc('triangle', 340, t), g = G(1);
  o.frequency.exponentialRampToValueAtTime(185, t + 0.05);
  env(g, t, vel * 0.55, 0.001, 0.11);
  chain(o, g, percIn); play(o, t, 0.11);
  noise(t, 0.04 + 0.12 * vel, 0.55 * vel, 'highpass', 1800, percIn);
}

// clap: three quick noise slaps and a tail into the echo, kept above the whistle's band
function clap(t, vel) {
  for (const [d, v, l] of [[0, 0.5, 0.012], [0.011, 0.45, 0.012], [0.022, 0.6, 0.14]]) noise(t + d, l, v * vel, 'bandpass', 2200, percIn, 1.2);
  noise(t, 0.2, 0.06 * vel, 'highpass', 2500, fxSend);
}

// the arp: a thin 12.5% pulse pluck with a sine bell an octave up

// goa laser: a square diving five octaves, into the echo

const riser = (t, dur, vol) => Engine.audio.riser(t, dur, vol, percIn);
// scene change: two falling square blips
function chime(t) {

// a note rings until the next one on its layer (at most max steps), never into the silent beat
function noteDur(layer, s, max) {
  let n = 1;
  while (n < max && !hit(layer, s + n) && !hushAt(s + n)) n++;
  return n * STEP * 0.9;
}

function voices(s, t) {
  const { id, lb, i } = at(s), D = id === 'drop', e8 = lb % 8;
  if (i === 0) secGain.gain.setValueAtTime(D ? 1 : 0.78, t);
  if (i === 0 && lb === 0 && !D && id !== 'title' && id !== 'outro') chime(t);
  if (id === 'title' && lb === 0 && i === 0) riser(t, BAR * 2, 0.5);
  if (SHORT && s === 0) { impact(t); kick(t, 1); crash(t); zap(t); acid(t, 64, STEP * 2, 0.9, true); } // the Short can't open on a quiet riser
  if (id === 'ignite' && lb === 0 && i === 0) riser(t, BAR * 3.75, 1.4);
  if (D && e8 === 7 && i === 0 && lb !== 31) riser(t, BAR * 0.97, 0.6);
  if (i === 0 && ((D && e8 === 0) || (id === 'outro' && lb === 0))) impact(t);
  const k = hit('kick', s); if (k) kick(t, k);
  const b = hit('bass', s); if (b) rollBass(t, b, i % 4 === 1 ? 0.7 : 0.9);
  const an = hit('acid', s); if (an) acid(t, an, noteDur('acid', s, 2), leadOpen(s), i % 4 === 0 || an >= 64);
  const hn = hit('hi', s); if (hn) hiLead(t, hn, noteDur('hi', s, 8));
  const hv = hit('hat', s); if (hv) { if (hv === 1) hatO(t); else hatC(t, i % 2 ? 0.3 : -0.3); }
  const cl = hit('clap', s); if (cl) clap(t, cl);
  const sn = hit('snare', s); if (sn) snare(t, sn);
  const a = hit('arp', s); if (a) arpNote(t, a, D ? 0.13 : 0.11, Math.sin(s * 0.7) * 0.4);
  if (hit('zap', s)) zap(t);
  if (hit('sweep', s)) sweep(t);
  if (hit('crash', s)) crash(t);
}

  cx.fillRect(x0 - 1, y0 - 1, 1, y1 - y0 + 3); cx.fillRect(x1 + 1, y0 - 1, 1, y1 - y0 + 3);
  // the arrival curve, drawn as it arrives: the same delay() the audio sweep is built from

function sceneDrop(lt, t, sec) {
  const bar = lb(lt), part = bar >> 3, e8 = bar % 8, s = Math.floor(t / STEP), beatN = Math.floor(t / BEAT);
  const ke = pulse('kick', t, 8), subCol = CYC[beatN % CYC.length];
  const r = DROP_PARTS[part](lt - part * 8 * BAR, t, s, e8, subCol);
  if (!CALM) ditherFill(subCol, 0.08 * ke);
  banner(r.title, 'ALL LAYERS: THE DROP!', subCol, subCol);
  fact(r.lines, subCol);
  timeline(r.time);
}

function sceneOutro(lt, t, sec) {
  stars(t);
  const s = Math.floor(t / STEP), op = leadOpen(s);
  magnetar(X, Y, t, s, { d: 0.3 + 0.7 * op });
  kickShells(t, s, X, Y, P.kick);
  banner('THE END', 'ACID LEAD ALONE: FILTER CLOSING', P.lead);
  fact([`${fmtNum(FRB.ms)} MS. ${FRB.yrs} YEARS OF SUNSHINE.`, { t: 'BRIGHTEST BURSTS SHOWN', c: P.lead }, { t: 'ENERGY ASSUMES ALL DIRECTIONS', c: P.dim }], P.lead);
  timeline(`RADIO SHIFTED ${fmtBig(SHIFT)} X TO HEAR`);
}

const SCENES = { pulse: scenePulse, power: scenePower, journey: sceneJourney, detector: sceneDetector, source: sceneSource,
                 ignite: sceneIgnite, drop: sceneDrop, outro: sceneOutro };

// ---------- one frame at song time tau; the engine's main loop calls it ----------
function draw(tau) {
  const t = tau % LOOP;
  const bar = Math.floor(t / BAR), sec = SONG[BAR_SEC[bar]], lt = t - sec.start * BAR;

  cx.setTransform(1, 0, 0, 1, 0, 0);
  cx.fillStyle = P.bg; cx.fillRect(0, 0, W, H);

  const ke = pulse('kick', t, 12), D = sec.id === 'drop';
  if (!CALM && D && ke > 0.3) {
    const s = Math.floor(t / STEP);
    cx.setTransform(1, 0, 0, 1, Math.round((hash(s) - 0.5) * 4 * ke), Math.round((hash(s + 99) - 0.5) * 4 * ke));
  }
  if (sec.id === 'title') sceneTitle(lt, t, { started: true });
  else SCENES[sec.id](lt, t, sec);
  cx.setTransform(1, 0, 0, 1, 0, 0);
  if (sec.id !== 'title') { meter(t); hud(t); }

  if (lt < 0.3 && !D && sec.k > 0) ditherFill(P.bg, 1 - lt / 0.3);
  const pl = lt % (8 * BAR);
  if (D && !CALM && pl < 0.3) ditherFill(P.white, 0.8 * (1 - pl / 0.3));
}

Engine.run({
  clock, buildGraph, voices, draw,
  title: sceneTitle,
  paused: P.kick,
  thumb: SONG.find(s => s.id === 'drop').start * BAR + 8 * BAR + 2 * BAR + 6 * STEP,   // host galaxy, between kicks (no flash)
});
})();
</script>
