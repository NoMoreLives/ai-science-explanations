<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saturn's Rings: Game Boy Mix</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="stylesheet" href="../engine/engine.css">
<style>html,body{background:#04050d;color:#6a72a0}</style>
</head>
<body>
<canvas id="c" width="180" height="320"></canvas>
<p>click / space: play-pause &middot; m: mute &middot; headphones + volume up &middot; ?bpm=150 &amp;calm=1 (no shake/flash)</p>
<script src="../engine/engine.js"></script>
<script>
(() => {
'use strict';

// ---------- config ----------
const { W, H } = Engine;
const { num, CALM, SHORT } = Engine.params;
const BPM = num('bpm', 150, 100, 190);

// the physics; real values (Cassini/IAU). Every number drawn on screen comes from these.
const GMK = 3.7931e7;                     // Saturn's GM, km^3/s^2
const RS = 60268;                         // Saturn's equatorial radius, km
const RING = { c0: 74658, b0: 92000, b1: 117580, a0: 122170, a1: 136775 };   // C, B, Cassini division, A ring edges, km
const MIMAS_A = 185540;                   // Mimas orbit, km
const PAN = { a: 133584, gap: 325, size: 28 };       // Encke gap
const DAPH = { a: 136505, gap: 42, size: 8, wave: 1.5 };   // Keeler gap; edge waves ~1.5 km tall
const PROM_A = 139380, PAND_A = 141700, F_A = 140180; // F ring and its two shepherds
const PROP_A = 129000;                    // an A-ring propeller moonlet
const RES_N = 2, RES_M = 1;               // Mimas 2:1
const omega = r => Math.sqrt(GMK / (r * r * r));            // rad/s, Kepler
const periodH = r => 2 * Math.PI / omega(r) / 3600;
const speedKms = r => Math.sqrt(GMK / r);
const R_RES = MIMAS_A * Math.pow(RES_M / RES_N, 2 / 3);     // where chunks lap twice per Mimas lap
const LAPS = periodH(MIMAS_A) / periodH(R_RES);
const CASS_C = (RING.b1 + RING.a0) / 2, CASS_W = (RING.a0 - RING.b1) / 2;   // the gap's centre and half width
const OM_M = omega(MIMAS_A);

const X = 90, Y = 112;
const BAR_H_F = 2 * Math.PI / OM_M / 4 / 3600, BAR_H_P = 2 * Math.PI / omega(PROM_A) / 3 / 3600;

// the track: one section per stage, each introducing one layer
const SONG = [
  { id: 'title', bars: 4 },
  { id: 'rings', bars: 8 },      // layer 1: wave-channel bass
  { id: 'orbits', bars: 8 },     // layer 2: noise drums
  { id: 'shepherd', bars: 8 },   // layer 3: pulse arp
  { id: 'resonance', bars: 8 },  // layer 4: pulse lead
  { id: 'clump', bars: 8 },      // layer 5: counter stabs + 16th hats
  { id: 'season', bars: 8 },     // breakdown, then snare roll + riser
  { id: 'drop', bars: 32 },      // everything, lead filter opens
  { id: 'outro', bars: 8 },
];
const clock = Engine.clock(BPM, SONG);
const { STEP, BAR, BEAT, BAR_SEC, LOOP, at, secDur, lb } = clock;
// display time (real seconds per song second): Mimas laps once every 4 bars in the wide views; zoom views are 3 hours a bar
const TSF = 2 * Math.PI / OM_M / (4 * BAR), TSZ = 3 * 3600 / BAR;
const TSP = 2 * Math.PI / omega(PROM_A) / (3 * BAR);

// A major: A, E/G#, F#m, D
const BR = [45, 40, 42, 38];
const CH = [[69, 73, 76, 81], [68, 71, 76, 80], [66, 69, 73, 78], [69, 74, 78, 81]];
const ARPI = [0, 1, 2, 3, 2, 1, 2, 3];
const BASSP = [0, -1, 12, -1, 0, -1, 12, -1, 0, -1, 12, -1, 0, -1, 7, 12];
const SCALE = new Set([9, 11, 1, 2, 4, 6, 8]);
const thirdBelow = m => SCALE.has(((m - 3) % 12 + 12) % 12) ? m - 3 : m - 4;
// leads: [step in the 4-bar loop, midi, length in steps]
function mel(list) { const m = new Array(64).fill(0), l = new Array(64).fill(0); for (const [s, n, len] of list) { m[s] = n; l[s] = len; } return { m, l }; }
const MA = mel([[0,76,2],[2,73,2],[4,76,2],[6,81,6],[12,83,2],[14,81,2], [16,80,4],[20,83,2],[22,80,2],[24,76,4],[28,80,2],[30,83,2],
                [32,81,2],[34,78,2],[36,73,2],[38,78,2],[40,81,4],[44,85,4], [48,83,2],[50,81,2],[52,78,2],[54,74,2],[56,78,2],[58,81,2],[60,83,2],[62,85,2]]);
const MB = mel([[0,85,6],[6,83,2],[8,81,4],[12,76,4], [16,83,6],[22,80,2],[24,76,4],[28,80,4],
                [32,81,4],[36,85,4],[40,88,6],[46,85,2], [48,86,4],[52,83,2],[54,81,2],[56,78,4],[60,81,2],[62,83,2]]);

function leadSel(id, lb) {
  if (id === 'resonance' || id === 'clump') return MA;
  if (id === 'season') return lb < 4 ? MB : null;
  if (id === 'drop') return ((lb >> 3) % 2) ? MB : MA;
  if (id === 'outro') return lb < 4 ? MA : null;
  return null;
}
const leadLen = s => { const { id, lb, i } = at(s), sel = leadSel(id, lb); return sel ? sel.l[(lb % 4) * 16 + i] : 0; };

// single source of truth for what plays on step s: audio, HUD and visuals all read this
function hit(layer, s) {
  const { id, lb, i } = at(s), ch = lb % 4, D = id === 'drop', e8 = lb % 8, part = lb >> 3;
  const hush = id === 'season' && lb === 7 && i >= 12;   // the silent beat before the drop
  const fill = D && e8 === 7 && i >= 12 && lb !== 31;    // snare roll into the next 8
  switch (layer) {
    case 'bass':
      if (id === 'rings') return i === 0 || (lb >= 4 && i === 8) ? BR[ch] : 0;
      if (id === 'season') return lb < 4 ? (i === 0 ? BR[ch] : 0) : hush ? 0 : (i % 4 === 0 ? BR[ch] : 0);
      if (id === 'orbits' || id === 'shepherd' || id === 'resonance' || id === 'clump' || D || id === 'outro') {
        if (id === 'outro') return i === 0 || i === 8 ? BR[ch] : 0;
        if (fill) return 0;
        const o = BASSP[i]; return o >= 0 ? BR[ch] + o : 0;
      }
      return 0;
    case 'kick':
      if (id === 'orbits') return i === 0 || i === 8 || (lb === 7 && i === 14) ? 1 : 0;
      if (id === 'clump') return i % 4 === 0 ? 1 : 0;
      if (id === 'season') return hush || lb < 4 ? 0 : lb < 6 ? (i === 0 ? 1 : 0) : (i % (lb === 6 ? 8 : 4) === 0 ? 1 : 0);
      if (D) return fill ? 0 : i % 4 === 0 ? 1 : 0;
      return 0;
    case 'snare':
      if (id === 'orbits') return lb >= 4 && (i === 4 || i === 12) ? 1 : 0;
      if (id === 'clump' || (D && !fill)) return i === 4 || i === 12 ? 1 : 0;
      return 0;
    case 'roll':
      if (id === 'season' && lb >= 4 && !hush) return [i % 4 === 0, i % 2 === 0, true, true][lb - 4] ? 0.35 + 0.65 * ((lb - 4) * 16 + i) / 60 : 0;
      return fill ? 0.5 + 0.12 * (i - 12) : 0;
    case 'hat':
      if (id === 'orbits') return lb < 2 ? 0 : lb < 4 ? (i % 4 === 2 ? 0.5 : 0) : i % 2 === 0 ? (i % 4 === 2 ? 0.7 : 0.35) : 0;
      if (id === 'clump' || (D && !fill)) return D && i === 14 && e8 % 2 === 1 ? 2 : i % 2 ? 0.25 : i % 4 === 2 ? 0.7 : 0.4;
      return 0;
    case 'arp': {
      if (hush || fill) return 0;
      const mode = id === 'shepherd' ? (lb < 4 ? 2 : 1) : id === 'season' ? (lb < 4 ? 2 : 1) : id === 'outro' ? 2 : (id === 'resonance' || id === 'clump' || D) ? 1 : 0;
      if (!mode || i % mode) return 0;
      return CH[ch][ARPI[(i / mode) % 8]] - (id === 'season' && lb >= 6 ? 0 : 12);
    }
    case 'lead': {
      const sel = leadSel(id, lb);
      if (!sel || hush || fill) return 0;
      return sel.m[ch * 16 + i];
    }
    case 'ctr':
      if (id === 'clump' || (D && !fill)) return i % 4 === 2 ? CH[ch][(i >> 2) & 1 ? 3 : 2] : 0;
      return 0;
    case 'harm': {
      if (!D || part < 2) return 0;
      const l = hit('lead', s); return l ? thirdBelow(l) : 0;
    }
    case 'crash': return i === 0 && ((D && e8 === 0) || (id === 'outro' && lb === 0)) ? 1 : 0;
    case 'drm': return hit('kick', s) || hit('snare', s) || hit('hat', s);
    case 'ctrs': return hit('ctr', s) || hit('harm', s);
    case 'fx': return hit('roll', s) || hit('crash', s);
  }
  return 0;
}
const { pulse, last } = Engine.envelopes(hit, clock);

const P = {
  bg: '#04050d', grid: '#10162e', edge: '#2c3760', dim: '#8088b8', fg: '#f0f2ff', shadow: '#000000', white: '#ffffff',
  bass: '#5cf0a0', bassD: '#1a5a3c', drm: '#ffb03a', drmD: '#6a4510', arp: '#4cd8ff', arpD: '#174f6e',
  led: '#ff6ad5', ledD: '#5e1f52', ctr: '#b9a6ff', ctrD: '#3b3070', fx: '#ff7a4a', fxD: '#6a2a14',
  gold: '#e8c070',
};
const CYC = [P.bass, P.drm, P.arp, P.led, P.ctr, P.fx];
const RINGC = ['#2c2418', '#5a4c36', '#94806a', '#d2c4a0', '#f4ecd8'];
const SATC = ['#21180f', '#5e4629', '#a8864f', '#dcc187', '#fbeec4'];

// ---------- canvas + gfx helpers ----------
const { cx, textW, text, card, BAYER, bay, fillCircle, line, dot, ditherFill } = Engine.gfx(P);
const { mulberry, hash } = Engine.rand;

// ordered-dither ring/disc, d = 0..1 density
function ditherCircle(x, y, r0, r1, col, d) {
  if (d <= 0) return;
  x = Math.round(x); y = Math.round(y); r1 = Math.round(r1);
  cx.fillStyle = col;
  const lvl = d * 16;
  for (let py = y - r1; py <= y + r1; py++) {
    if (py < 0 || py >= H) continue;
    for (let px = x - r1; px <= x + r1; px++) {
      const dd = (px - x) ** 2 + (py - y) ** 2;
      if (dd <= r1 * r1 && dd >= r0 * r0 && bay(px, py) < lvl) cx.fillRect(px, py, 1, 1);
    }
  }
}

// thin dithered ring, sampled by angle; sy squashes it into an ellipse
function ring(x, y, r, col, th, d, sy = 1) {
  if (d <= 0 || r < 1) return;
  cx.fillStyle = col;
  const lvl = d * 16, n = Math.ceil(r * 7) + 8;
  for (let k = 0; k < n; k++) {
    const a = k / n * 2 * Math.PI, c = Math.cos(a), s = Math.sin(a);
    for (let j = 0; j < th; j++) {
      const px = Math.round(x + c * (r + j)), py = Math.round(y + s * (r + j) * sy);
      if (bay(px, py) < lvl) cx.fillRect(px, py, 1, 1);
    }
  }
}

function arrow(x0, y0, x1, y1, col) {
  line(x0, y0, x1, y1, col);
  const a = Math.atan2(y1 - y0, x1 - x0);
  for (const s of [-1, 1]) line(x1, y1, x1 + 3 * Math.cos(a + s * 2.5), y1 + 3 * Math.sin(a + s * 2.5), col);
}

const rng = mulberry(1986);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const angDiff = (a, b) => Math.atan2(Math.sin(a - b), Math.cos(a - b));
const smooth = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };

const STARS = Array.from({ length: 140 }, () => ({ x: rng() * W | 0, y: rng() * H | 0, b: rng() }));
function stars(t) {
  STARS.forEach((s, k) => { cx.fillStyle = (k * 7 + Math.floor(t * 6)) % 11 === 0 ? P.fg : s.b > 0.6 ? P.dim : P.edge; cx.fillRect(s.x, s.y, 1, 1); });
}

// ---------- the rings: a few thousand chunks on Kepler orbits ----------
const pickC = (ramp, v, px, py) => {
  const n = ramp.length - 1, x = clamp(v, 0, 0.999) * n, b = Math.floor(x);
  return ramp[Math.min(n, b + ((BAYER[(py & 3) * 4 + (px & 3)] + 0.5) / 16 < x - b ? 1 : 0))];
};
// brightness of each ring (B is the brightest, C the faintest), and its band for the colour-coded view
const ringBase = r => r < RING.b0 ? 0.3 : r < RING.b1 ? 0.8 : r < RING.a0 ? 0.55 : 0.62;
const ringBand = r => r < RING.b0 ? 0 : r < RING.b1 ? 1 : 2;
const BANDC = [[P.arp, P.arpD], [P.ctr, P.ctrD], [P.drm, P.drmD]];

// move chunks away from a gap: [0, W] either side of c is squeezed into [w*o, W], so the gap empties and its edges pile up
function mapGap(r, c, w, Wm, o) {
  const d = r - c, ad = Math.abs(d);
  if (o <= 0 || ad >= Wm) return r;
  const s2 = w * o + ad * (1 - w * o / Wm);
  return c + (d < 0 ? -s2 : s2);
}

const FULL = [];
{
  const rr = mulberry(7), rOut = RING.a1 + 200;
  while (FULL.length < 3400) {
    const r = RING.c0 + rr() * (rOut - RING.c0);
    if (rr() < (r < RING.b0 ? 0.45 : 1)) FULL.push({ r, th: rr() * 2 * Math.PI, om: omega(r), sh: rr() });
  }
}

const LV = (() => { const v = [-0.62, 0.55, 0.56], n = Math.hypot(...v); return v.map(c => c / n); })();   // sunlight, view space

// Saturn: banded ball, pole tipped el toward us (pi/2 = straight down)
function planet(S) {
  const Rp = RS / S.kmPx, ce = Math.cos(S.el), se = Math.sin(S.el), x0 = S.x0, y0 = S.y0;
  ditherCircle(x0, y0, Math.round(Rp), Math.round(Rp) + 7, S.glowC || P.bass, S.glow || 0);
  for (let py = Math.floor(y0 - Rp); py <= Math.ceil(y0 + Rp); py++) for (let px = Math.floor(x0 - Rp); px <= Math.ceil(x0 + Rp); px++) {
    const x = (px + 0.5 - x0) / Rp, yu = (y0 - py - 0.5) / Rp, qq = x * x + yu * yu;
    if (qq >= 1) continue;
    const zs = Math.sqrt(1 - qq), lat = Math.asin(clamp(yu * ce + zs * se, -1, 1));
    const band = 0.5 + 0.17 * Math.sin(lat * 13) + 0.08 * Math.sin(lat * 29 + 1);
    const lit = clamp(0.12 + (x * LV[0] + yu * LV[1] + zs * LV[2]), 0.04, 1.1) * (0.6 + 0.4 * zs);
    cx.fillStyle = pickC(SATC, band * lit * (S.dim ?? 1), px, py);
    cx.fillRect(px, py, 1, 1);
  }
}

// one half of the ring (front = the near side, drawn over the planet)
function ringPass(S, front) {
  const kp = S.kmPx, sy = S.sy, tt = S.tt, fade = S.dim ?? 1;
  for (const p of FULL) {
    let r = mapGap(p.r, CASS_C, CASS_W, CASS_W + 1900, S.cass || 0);
    const th = p.th + p.om * tt, sn = Math.sin(th);
    if ((sn >= 0) !== front) continue;
    const cs = Math.cos(th);
    if (S.wob > 0) {
      const d = (p.r - R_RES) / 1800;
      if (d * d < 9) r *= 1 + S.wob * 0.06 * Math.exp(-d * d) * Math.cos(2 * (th - OM_M * tt));
    }
    const px = Math.round(S.x0 + r * cs / kp), py = Math.round(S.y0 + r * sn * sy / kp);
    if (px < 0 || px >= W || py < 0 || py >= H) continue;
    let v = ringBase(p.r) * (0.6 + 0.4 * p.sh);
    if (cs > 0 && Math.abs(r * sn) < RS) v *= 0.25;     // in the planet's shadow
    if (S.band) {
      const b = BANDC[ringBand(p.r)];
      cx.fillStyle = p.sh > 0.45 ? b[0] : b[1];
    } else cx.fillStyle = RINGC[Math.min(4, Math.floor(v * fade * 5))];
    cx.fillRect(px, py, 1, 1);
  }
}
function ringsView(S) {
  S.sy = Math.sin(S.el);
  ringPass(S, false);
  planet(S);
  ringPass(S, true);
}

// a moon (white dot, optional halo) on a circular orbit of radius a, angle th
function moonAt(S, a, th, halo, col = P.white, rpx = 1) {
  const x = Math.round(S.x0 + a * Math.cos(th) / S.kmPx), y = Math.round(S.y0 + a * Math.sin(th) * S.sy / S.kmPx);
  if (halo > 0.05) ditherCircle(x, y, 0, 3 + Math.round(3 * halo), col, 0.7 * halo);
  fillCircle(x, y, rpx, P.white);
  return [x, y];
}
// the radius a at angle ang in the ring plane, on screen
const ringXY = (S, a, ang) => [S.x0 + a * Math.cos(ang) / S.kmPx, S.y0 + a * Math.sin(ang) * S.sy / S.kmPx];

const fullS = (t, o) => Object.assign({ x0: X, y0: Y, kmPx: 2150, el: Math.PI / 2, tt: t * TSF, cass: 1, wob: 0, glow: 0, dim: 1 }, o);

// ---------- zoomed strips: the view rides along with a moon, chunks stream past on Kepler shear ----------
// Z: a (moon orbit, km), w (gap half width), W (region swept), o (0..1 open), amp (edge wave size / w), L (gap length, km, or none),
// kmPx, tt, hp (half height px), cy (centre row), n, seed, post (pixel hook)
function zoomView(Z) {
  const Om = omega(Z.a), wide = W * Z.kmPx, hp = Z.hp, n = Z.n || 2400;
  for (let k = 0; k < n; k++) {
    const d0 = (hash(k * 3 + Z.seed) * 2 - 1) * hp * Z.kmPx;
    const u0 = hash(k * 3 + 1 + Z.seed) * wide, sh = hash(k * 3 + 2 + Z.seed);
    const u = (((u0 - 1.5 * Om * d0 * Z.tt) % wide) + wide) % wide, s = u - wide / 2;
    const oo = Z.o * (Z.L ? Math.exp(-((s / Z.L) ** 2)) : 1);
    let d = mapGap(d0, 0, Z.w, Z.W, oo);
    if (Z.amp && s * d0 < 0) {   // chunks that have passed the moon ring with the encounter (wavelength shrinks near the gap)
      const ph = -s / (1.5 * d0);
      d += Math.min(0.4 * Math.abs(d), Z.amp * Z.w * (Z.w / Math.abs(d0)) ** 2 * oo) * Math.sin(ph);
    }
    let x = u / Z.kmPx, y = Z.cy - d / Z.kmPx;
    if (Z.post) [x, y] = Z.post(x, y);
    const px = Math.round(x), py = Math.round(y);
    if (py < Z.cy - hp || py > Z.cy + hp || px < 0 || px >= W) continue;
    let v = 0.4 + 0.5 * sh;
    if (oo > 0 && Math.abs(d) < Z.w * oo * 1.6) v += 0.15;
    cx.fillStyle = RINGC[Math.min(4, Math.floor(v * 5))];
    cx.fillRect(px, py, 1, 1);
  }
  cx.fillStyle = P.edge;
  cx.fillRect(0, Z.cy - hp - 1, W, 1); cx.fillRect(0, Z.cy + hp + 1, W, 1);
}

// ---------- overlays that ride on the music ----------
function kickShells(t, s, x0, y0, cols = CYC) {
  for (let k = 0; k < 40; k++) {
    if (!hit('kick', s - k)) continue;
    const r = 8 + (t - (s - k) * STEP) * 90;
    if (r > 140) break;
    ring(x0, y0, r, cols[((s - k) >> 2) % cols.length], 1, 0.3 * (1 - r / 140));
  }
}
// leader line + label out from the ring at radius a, angle ang
function ringLabel(S, a, ang, txt, col, dx = 14, dy = -10) {
  const [x, y] = ringXY(S, a, ang), x2 = x + dx, y2 = y + dy;
  line(x, y, x2, y2, col, 0.8);
  label(txt, Math.round(x2 + (dx >= 0 ? 2 : -2)), Math.round(y2 - 3), col, dx >= 0 ? 'l' : 'r');
}

// ---------- text helpers ----------
function fmtNum(v) { return v >= 10 ? String(Math.round(v)) : String(Math.round(v * 10) / 10); }
const fmtBig = v => v >= 1e4 ? Math.round(v).toLocaleString('en-US') : fmtNum(v);
const banner = (title, sub, col, subCol = P.fg) => card([{ t: title, s: 2, c: col }, { t: sub, c: subCol }], 4, 90, col);
const fact = (lines, border) => card(lines.map(l => typeof l === 'string' ? { t: l } : l), 200, 90, border);
const timeline = s => { const w = textW(s, 1) + 6; cx.fillStyle = P.bg; cx.fillRect(90 - (w >> 1), 242, w, 9); text(s, 90, 244, P.dim, 1, 'c'); };
function label(s, x, y, col, align = 'l') {
  for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1], [1, 1]]) text(s, x + dx, y + dy, P.shadow, 1, align);
  text(s, x, y, col, 1, align);
}

// ---------- audio (everything synthesised: a Game Boy's four channels) ----------
const { ctx, midi, track, G, F, chain, pan, osc, play } = Engine.audio;
// P1/P2 pulse (12.5/25/50% duty), WAVE (a 32-step 4-bit table), NOISE (LFSR). All of it also goes through a 4-bit staircase for crunch.
let master, secGain, comp, chip, p1In, p2In, wvIn, nzIn, echoSend, leadLP;
let WT, nz15, nz7;

// every node made while one step is being scheduled; all are disconnected once that step's last sound ends
// (Chrome tidies finished notes up by itself, Safari keeps processing them and slows to a crawl)

// the wave channel: 32 four-bit samples, turned into harmonics
function tableWave() {
  const N = 32, t = [];
  for (let i = 0; i < N; i++) t.push(clamp(Math.round(7.5 + 7.5 * (0.8 * Math.sin(2 * Math.PI * i / N) + 0.35 * Math.sin(4 * Math.PI * i / N + 0.6))), 0, 15) / 7.5 - 1);
  const re = new Float32Array(16), im = new Float32Array(16);
  for (let k = 1; k < 16; k++) for (let i = 0; i < N; i++) { re[k] += t[i] * Math.cos(2 * Math.PI * k * i / N) * 2 / N; im[k] += t[i] * Math.sin(2 * Math.PI * k * i / N) * 2 / N; }
  return ctx().createPeriodicWave(re, im);
}
// noise channel: a real linear-feedback shift register, 15-bit (hiss) or 7-bit (metallic buzz)
function lfsrBuf(bits, seconds) {
  const hold = Math.max(1, Math.round(ctx().sampleRate / 14000)), len = Math.round(ctx().sampleRate * seconds);
  const buf = ctx().createBuffer(1, len, ctx().sampleRate), d = buf.getChannelData(0);
  let reg = (1 << bits) - 1, out = 1;
  for (let i = 0; i < len; i++) {

function voices(s, t) {
  const { id, lb, i } = at(s), ch = lb % 4, D = id === 'drop', e8 = lb % 8, part = lb >> 3;
  if (i === 0) {
    secGain.gain.setValueAtTime(D ? 1 : 0.85, t);
    // the lead's filter: shut-ish in the build, flung open at the drop
    if (D && lb === 0) { leadLP.frequency.setValueAtTime(600, t); leadLP.frequency.exponentialRampToValueAtTime(14000, t + BAR * 2); }
    else if (id === 'resonance') leadLP.frequency.setValueAtTime(2400, t);
    else if (id === 'clump') leadLP.frequency.setValueAtTime(3600, t);
    else if (id === 'season') leadLP.frequency.setValueAtTime(2600, t);
    else if (id === 'outro' && lb === 0) leadLP.frequency.setValueAtTime(3000, t);
  }
  if (i === 0 && lb === 0 && !D && id !== 'title' && id !== 'outro') chime(t);
  if (id === 'title' && lb === 0 && i === 0) riser(t, BAR * 4, 0.45);
  if (SHORT && s === 0) { impact(t); kick(t, 1); crash(t); bassNote(t, BR[0], STEP * 6, 0.5); }
  if (id === 'season' && lb === 4 && i === 0) riser(t, BAR * 3.75, 1.2);

  if (i === 0 && ((D && e8 === 0) || (id === 'outro' && lb === 0))) impact(t);

  const ld = hit('lead', s);
  if (ld) {

  const S = fullS(t, { y0: 118, kmPx: 2150, el: 0.8 });
  for (const [a, w] of [[CASS_C - CASS_W, 1], [CASS_C + CASS_W, 1], [PAN.a, 1], [DAPH.a, 1]]) ring(S.x0, S.y0, a / S.kmPx, P.white, 1, 1, Math.sin(S.el));
  text('ALL GAPS', X, 220 - 18, P.white, 2, 'c');
}

function sceneSeason(lt, t, sec) {
  const n = countdownN(lt, sec);
  if (n < 0) { stars(t); gapFlash(t); return; }
  stars(t);
  const bar = lb(lt), p = smooth(lt / (8 * BAR));
  const S = fullS(t, { y0: 118, kmPx: 2300 - 500 * p, el: 0.85 - 0.3 * p, wob: 0.3, glow: 0.2 * pulse('bass', t, 3) });
  ringsView(S);
  moonAt(S, MIMAS_A, OM_M * S.tt, pulse('arp', t, 8), P.led, 1);
  banner('6. ALL TOGETHER', bar < 4 ? 'BREAKDOWN: BASS + ARP' : 'BUILD: SNARE ROLL + RISER', P.fx);
  fact(bar < 4 ? ['SHEPHERDS PUSH FROM BOTH SIDES', { t: 'RESONANCE: A TIMED PUMP', c: P.fx }, { t: 'GRAVITY: CLUMP, THEN SHEAR', c: P.dim }]
               : ['EVERY GAP IS A TUG-OF-WAR', { t: 'THE RINGS ARE ALIVE', c: P.fx }, { t: 'NOW WATCH THEM ALL AT ONCE...', c: P.dim }], P.fx);
  timeline(`1 BAR = ${BARF} H. SCHEMATIC`);
  if (n > 0) { text(String(n), X + 2, 92, P.shadow, 6, 'c'); text(String(n), X, 90, P.white, 6, 'c'); }
}

// --- the drop: four 8-bar parts ---
function dropTop(plt, t, s, e8) {
  stars(t);
  const lp = pulse('lead', t, 6), S = fullS(t, { y0: 112, kmPx: 2150, wob: 0.35, cass: 1, glow: 0.3 * pulse('bass', t, 4) });
  ringsView(S);
  kickShells(t, s, X, Y);
  const thM = OM_M * S.tt;
  moonAt(S, MIMAS_A, thM, lp, P.led, 2);
  ring(X, Y, R_RES / S.kmPx, P.led, 1, 0.3);
  ringLabel(S, CASS_C, -0.8, 'CASSINI', P.fg, 12, -9);
  ringLabel(S, PAN.a, 0.9, 'ENCKE', P.arp, 8, 10);
  return { title: '7. THE WHOLE SYSTEM',
    lines: e8 < 4 ? [`MIMAS EMPTIES ${fmtBig(Math.round(2 * CASS_W / 100) * 100)} KM`, { t: 'THE CASSINI DIVISION', c: P.led }, { t: 'A 2:1 RESONANCE, RIGHT HERE', c: P.dim }]
                  : [{ t: 'PAN HOLDS OPEN THE ENCKE GAP', c: P.arp }, `ONLY ${PAN.gap} KM, SUB-PIXEL HERE`, { t: 'ZOOM IN LATER...', c: P.dim }],
    time: `FROM ABOVE THE POLE. 1 BAR = ${BARF} H` };
}
function dropShadow(plt, t, s, e8) {
  stars(t);
  const S = fullS(t, { y0: 124, kmPx: 1900, el: 0.38 + 0.16 * Math.sin(plt * 0.5), glow: 0.25 * pulse('bass', t, 4), wob: 0.2 });
  ringsView(S);
  moonAt(S, MIMAS_A, OM_M * S.tt, pulse('lead', t, 6), P.led, 1);
  return { title: '8. SHADOW + GAPS',
    lines: e8 < 4 ? ['SATURN CASTS A SHADOW', { t: 'ON ITS OWN RINGS', c: P.gold }, { t: 'B RING: DENSE AND BRIGHT', c: P.dim }]
                  : ['C RING: THIN AND FAINT', { t: 'A RING: HOME OF THE SHEPHERDS', c: P.gold }, { t: 'CASSINI DIVISION BETWEEN B + A', c: P.dim }],
    time: `1 BAR = ${BARF} H. SHADOW SCHEMATIC` };
}
function dropZoom(plt, t, s, e8) {
  const tt = t * TSZ, pa = pulse('arp', t, 8);
  const z1 = strips({ a: PAN.a, w: PAN.gap / 2, W: PAN.gap * 1.5, o: 1, amp: 0.7 + 0.15 * pa, kmPx: 24, tt, seed: 11, n: 1700, hp: 34 }, 62);
  const z2 = strips({ a: DAPH.a, w: DAPH.gap / 2, W: DAPH.gap * 1.5, o: 1, amp: 0.6 + 0.12 * pa, kmPx: 2.7, tt, seed: 29, n: 1700, hp: 34 }, 138);
  zoomView(z1); zoomView(z2);
  for (const Z of [z1, z2]) { ditherCircle(X, Z.cy, 0, 7, P.arp, 0.6 * pa); fillCircle(X, Z.cy, 2, P.white); }
  label(`PAN, ${PAN.gap} KM GAP`, 4, 62 - 31, P.arp);
  label(`DAPHNIS, ${DAPH.gap} KM GAP`, 4, 138 - 31, P.arp);
  return { title: '9. TWO SHEPHERDS',
    lines: e8 < 4 ? ['TWO MOONS, TWO GAPS', { t: `PAN: ${PAN.size} KM MOON, ${PAN.gap} KM GAP`, c: P.arp }, { t: `DAPHNIS: ${DAPH.size} KM MOON, ${DAPH.gap} KM GAP`, c: P.arp }]
                  : ['EACH FLYBY SETS UP A WAVE', { t: `DAPHNIS: EDGE WAVES ~${DAPH.wave} KM`, c: P.arp }, { t: 'SHOWN BIGGER THAN LIFE', c: P.dim }],
    time: '1 BAR = 3 H. MOONS + WAVES EXAGGERATED' };
}
function dropF(plt, t, s, e8) {
  stars(t);
  const R0 = 50, kp = 50, tt = t * TSP, omF = omega(F_A);
  fillCircle(X, Y, Math.round(RS / (F_A / R0)), '#5e4629'); fillCircle(X, Y, Math.round(RS / (F_A / R0)) - 2, '#a8864f');
  const thP = omega(PROM_A) * tt, thD = omega(PAND_A) * tt;
  ring(X, Y, R0 + (PROM_A - F_A) / kp, P.led, 1, 0.3); ring(X, Y, R0 + (PAND_A - F_A) / kp, P.ctr, 1, 0.3);
  for (let k = 0; k < 1500; k++) {
    const st = k % 3, th = hash(k * 5) * 2 * Math.PI + omF * tt;
    let off = 170 * Math.sin(2 * (th - 0.5 * omF * tt) + st * 2.094) + 90 * Math.sin(5 * (th - 0.5 * omF * tt) + st * 1.3) + (hash(k * 5 + 1) - 0.5) * 50;
    off -= 230 * Math.exp(-((angDiff(th, thP) / 0.35) ** 2)) * (st === 0 ? 1 : 0.4);
    off += 230 * Math.exp(-((angDiff(th, thD) / 0.35) ** 2)) * (st === 2 ? 1 : 0.4);
    const r = R0 + off / kp;
    cx.fillStyle = RINGC[2 + (k % 2) + (st === 1 ? 1 : 0)];
    cx.fillRect(Math.round(X + r * Math.cos(th)), Math.round(Y + r * Math.sin(th)), 1, 1);
  }
  for (const [a, th, col, nm, ph] of [[PROM_A, thP, P.led, 'PROMETHEUS', pulse('lead', t, 6)], [PAND_A, thD, P.ctr, 'PANDORA', pulse('ctrs', t, 6)]]) {
    const r = R0 + (a - F_A) / kp, x = Math.round(X + r * Math.cos(th)), y = Math.round(Y + r * Math.sin(th));
    ditherCircle(x, y, 0, 3 + Math.round(3 * ph), col, 0.7 * ph); fillCircle(x, y, 2, P.white);
    label(nm, clamp(x, 28, 152), y + 5, col, 'c');
  }
  return { title: '10. THE F RING',
    lines: e8 < 4 ? ['A THIN, BRAIDED RING', { t: 'HELD BY TWO SHEPHERDS', c: P.gold }, { t: 'PROMETHEUS IN, PANDORA OUT', c: P.dim }]
                  : ['EACH PASS PULLS A STREAMER', { t: 'THE STRANDS TWIST + CLUMP', c: P.gold }, { t: 'NO STRAND STAYS THE SAME', c: P.dim }],
    time: `1 BAR = ${fmtNum(BAR_H_P)} H. RADIAL SCALE X${Math.round(2150 / kp)}` };
}

const DROP_PARTS = [dropTop, dropShadow, dropZoom, dropF];
function sceneDrop(lt, t, sec) {
  const bar = lb(lt), part = bar >> 3, e8 = bar % 8, s = Math.floor(t / STEP), beatN = Math.floor(t / BEAT);
  const ke = pulse('kick', t, 8), plt = lt - part * 8 * BAR;
  const r = DROP_PARTS[part](plt, t, s, e8);
  if (!CALM) ditherFill(CYC[beatN % CYC.length], 0.06 * ke);
  const subCol = CYC[beatN % CYC.length];
  banner(r.title, 'ALL LAYERS: THE DROP!', subCol, subCol);
  fact(r.lines, subCol);
  timeline(r.time);
}

function sceneOutro(lt, t, sec) {
  stars(t);
  const p = lt / secDur(sec);
  const S = fullS(t, { y0: 120, kmPx: 3000, el: 0.65, wob: 0.3, glow: 0.2 * pulse('bass', t, 3) });
  ringsView(S);
  moonAt(S, MIMAS_A, OM_M * S.tt, pulse('arp', t, 8), P.led, 1);
  if (p > 0.5) ditherFill(P.bg, Math.min(0.9, (p - 0.5) * 2.2));
  banner('THE END', 'LAYER 1 AGAIN: BASS + ARP', P.bass);
  fact([`GAPS = MOONS + ${RES_N}:${RES_M} RESONANCES`, { t: 'CHUNKS: CLUMP, CLEAR, REPEAT', c: P.bass }], P.bass);
  text('SCHEMATIC: MOONS, WAVES, CHUNKS', X, 228, P.edge, 1, 'c');
  text('TIME SPED UP. NOT AN N-BODY SIM', X, 236, P.edge, 1, 'c');
}

const SCENES = { title: sceneTitle, rings: sceneRings, orbits: sceneOrbits, shepherd: sceneShepherd, resonance: sceneResonance,
                 clump: sceneClump, season: sceneSeason, drop: sceneDrop, outro: sceneOutro };

// ---------- one frame at song time tau; the engine's main loop calls it ----------
function draw(tau) {
  const t = tau % LOOP;
  const bar = Math.floor(t / BAR), sec = SONG[BAR_SEC[bar]], lt = t - sec.start * BAR;

  cx.setTransform(1, 0, 0, 1, 0, 0);
  cx.fillStyle = P.bg; cx.fillRect(0, 0, W, H);

  const ke = pulse('kick', t, 12), D = sec.id === 'drop';
  if (!CALM && D && ke > 0.3) {
    const s = Math.floor(t / STEP);
    cx.setTransform(1, 0, 0, 1, Math.round((hash(s) - 0.5) * 3 * ke), Math.round((hash(s + 99) - 0.5) * 3 * ke));
  }
  if (sec.id === 'title') sceneTitle(lt, t, { started: true });
  else SCENES[sec.id](lt, t, sec);
  cx.setTransform(1, 0, 0, 1, 0, 0);
  if (sec.id !== 'title') hud(t);

  if (lt < 0.3 && !D && sec.k > 0) ditherFill(P.bg, 1 - lt / 0.3);
  const pl = lt % (8 * BAR);
  if (D && !CALM && pl < 0.3) ditherFill(P.white, 0.8 * (1 - pl / 0.3));
}

Engine.run({
  clock, buildGraph, voices, draw,
  title: sceneTitle,
  paused: P.arp,
  thumb: SONG.find(s => s.id === 'drop').start * BAR + 2 * BAR + 6 * STEP,   // the whole system, two bars into the drop, between kicks
});
})();
</script>
