<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8-Bit Science</title>
<style>
  :root {
    --bg: #0b0d1a;
    --panel: #151932;
    --border: #5b6cff;
    --text: #e8ecff;
    --muted: #8b93c9;
    --accent: #ffd23f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Courier New", monospace;
    image-rendering: pixelated;
  }
  main { max-width: 960px; margin: 0 auto; padding: 48px 16px; }
  h1 {
    margin: 0 0 8px;
    font-size: clamp(28px, 6vw, 48px);
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--accent);
    text-shadow: 4px 4px 0 #7a4b00;
  }
  .sub { color: var(--muted); margin: 0 0 40px; }
  .grid {
    display: grid;
    gap: 24px;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  }
  a.card {
    display: block;
    padding: 20px;
    background: var(--panel);
    border: 4px solid var(--border);
    box-shadow: 6px 6px 0 #000;
    color: inherit;
    text-decoration: none;
    transition: transform .08s, box-shadow .08s;
  }
  a.card:hover, a.card:focus-visible {
    transform: translate(3px, 3px);
    box-shadow: 3px 3px 0 #000;
    border-color: var(--accent);
    outline: none;
  }
  .card .icon { font-size: 40px; line-height: 1; margin-bottom: 12px; }
  .card img.pixel { width: 48px; height: 48px; image-rendering: pixelated; display: block; margin-bottom: 12px; }
  .card h2 { margin: 0 0 8px; font-size: 18px; text-transform: uppercase; }
  .card p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.4; }
  .card .go { margin-top: 16px; color: var(--accent); font-size: 14px; }
  footer { margin-top: 48px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>8-Bit Science</h1>
  <p class="sub">Pick an experiment. Press start inside to enable audio.</p>
  <div class="grid" id="grid"></div>
  <footer>Made without <code>love</code></footer>
</main>
<script>
  // Each folder with its own index.html. Add new ones here.
  const experiments = [
    { path: "sun-lifecycle-2/", icon: "sun-lifecycle-2/icon.svg", title: "Life of a Sun: Hardcore Mix", desc: "A 150 BPM chiptune hardcore track: each layer is one phase of a star's life, then it all drops." },
    { path: "black-hole/", icon: "black-hole/icon.svg", title: "Black Hole: Industrial Mix", desc: "A 160 BPM chip-industrial techno track: star, collapse, supernova, horizon, disk, then a 32-bar drop of jets, merger, Hawking glow and evaporation." },
    { path: "comet/", icon: "comet/icon.svg", title: "Ice Comet: Techno Mix", desc: "A 138 BPM chip techno track riding a Halley-like orbit: Oort cloud, fall, frost line, coma, tails, perihelion, then a 32-bar drop of meteors, melting and breakup." },
    { path: "saturn-hexagon/", icon: "saturn-hexagon/icon.svg", title: "Saturn's Hexagon: Liquid Jungle Mix", desc: "A 172 BPM chip jungle track: pad, amen break, sub, ride and bells each build one piece of the polar storm, then a 32-bar drop of the full hexagon, the rings and a dive into the eye." },
    { path: "saturn-rings/", icon: "saturn-rings/icon.svg", title: "Saturn's Rings: Game Boy Mix", desc: "A 150 BPM Game Boy chiptune in A major: wave bass, noise drums, pulse arp, lead and counter each build one piece of the rings, from Kepler orbits to shepherd moons, the Mimas 2:1 resonance and clumping, then a 32-bar drop of the whole system, Pan and Daphnis, and the braided F ring." },
    { path: "saturn-ring-gaps/", icon: "saturn-ring-gaps/icon.svg", title: "Saturn's Ring Gaps: Octave Mix", desc: "A 140 BPM Game Boy chiptune in D, the note Mimas's orbit makes sped up 12 million times: wave bass, noise drums, pulse arps, lead and two pure orbit tones each build one piece of the rings, until a probe slides into the 2:1 resonance and its beat dies into an octave, then a 32-bar drop of the Cassini Division, Pan's and Daphnis's wakes, a resonance map and the whole system." },
    { path: "cats-eye/", icon: "cats-eye/icon.svg", title: "Cat's Eye Nebula: DnB Mix", desc: "A 174 BPM chip drum & bass track: a dying star sheds shells, then wind, X-ray bubble, jets and white-dwarf core each add a layer, until a square lead's filter opens into a 32-bar drop of glowing gas." },
    { path: "gravitational-waves/", icon: "gravitational-waves/icon.svg", title: "Gravitational Waves: Cosmic Halftime Mix", desc: "A 140 BPM chip halftime track in B minor, the note the merged black hole rings at: pad, arp, drums, laser hats and wobble each build one piece of GW150914, then LIGO's real chirp, slowed then at real speed, drops into 32 bars of merger, energy, journey and detection." },
    { path: "55-cancri-e/", icon: "55-cancri-e/icon.svg", title: "55 Cancri e: Atmospheric DnB Mix", desc: "A 172 BPM atmospheric chip drum & bass track tuned to the planet's 17.7-hour year: pad, rolling break, sub, lava hats and diamond bells each build one piece of a world 25x closer to its star than Mercury, then a 32-bar drop asking: diamond, or lava?" },
    { path: "time-dilation/", icon: "time-dilation/icon.svg", title: "Time Dilation: Ambient Chip Mix", desc: "A 90 BPM ambient chiptune near Sgr A*: a probe lowered on a tether ticks slower and sings lower, stopping only where its clock rate is a musical interval (A, G, F, D), until time runs at half speed and the track drops into half time an octave down, then quarter time." },
    { path: "frb/", icon: "frb/icon.svg", title: "Fast Radio Burst: Goa Trance Mix", desc: "A 140 BPM chip goa track: kick, rolling bass, acid, hats and arp build a 1 ms burst with 80 years of the Sun's energy, its real-speed dispersion whistle, then a 32-bar space drop of warp, host galaxy, whole sky and repeaters." },
  ];

  const grid = document.getElementById("grid");
  for (const e of experiments) {
    const a = document.createElement("a");
    a.className = "card";
    a.href = "view.html?scene=" + encodeURIComponent(e.path);
    a.innerHTML = `<div class="icon"></div><h2></h2><p></p><div class="go">▶ PLAY</div>`;
    const icon = a.querySelector(".icon");
    if (e.icon.endsWith(".svg")) {
      const img = document.createElement("img");
      img.className = "pixel";
      img.alt = "";
      img.src = e.icon;
      icon.replaceWith(img);
    } else {
      icon.textContent = e.icon;
    }
    a.querySelector("h2").textContent = e.title;
    a.querySelector("p").textContent = e.desc;
    grid.appendChild(a);
  }
</script>
</body>
</html>
