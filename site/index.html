<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8-Bit Science</title>
<style>
  /* the scenes' neutrals (Engine.NEUTRALS and engine.css), plus one accent */
  :root {
    --bg: #020108;
    --panel: #120f26;
    --border: #8a86c0;
    --text: #f2eeff;
    --muted: #8a86c0;
    --accent: #ffd23f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Courier New", monospace;
    image-rendering: pixelated;
  }
  main { max-width: 960px; margin: 0 auto; padding: 48px 16px; }
  h1 {
    margin: 0 0 8px;
    font-size: clamp(28px, 6vw, 48px);
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--accent);
    text-shadow: 4px 4px 0 #7a4b00;
  }
  .sub { color: var(--muted); margin: 0 0 40px; }
  .grid {
    display: grid;
    gap: 24px;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  }
  a.card {
    display: block;
    padding: 20px;
    background: var(--panel);
    border: 4px solid var(--border);
    box-shadow: 6px 6px 0 #000;
    color: inherit;
    text-decoration: none;
    transition: transform .08s, box-shadow .08s;
  }
  a.card:hover, a.card:focus-visible {
    transform: translate(3px, 3px);
    box-shadow: 3px 3px 0 #000;
    border-color: var(--accent);
    outline: none;
  }
  .card img.pixel { width: 48px; height: 48px; image-rendering: pixelated; display: block; margin-bottom: 12px; }
  .card h2 { margin: 0 0 8px; font-size: 18px; text-transform: uppercase; }
  .card p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.4; }
  .card .go { margin-top: 16px; color: var(--accent); font-size: 14px; }
  footer { margin-top: 48px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>8-Bit Science</h1>
  <p class="sub">Pick an experiment. Press start inside to enable audio.</p>
  <div class="grid" id="grid"></div>
  <footer>Made without <code>love</code></footer>
</main>
<script src="scenes.js"></script>
<script>
  // the list comes from scenes.js, built from each scene's scene.json by `npm run index`
  const grid = document.getElementById("grid");
  for (const e of window.SCENES) {
    const a = document.createElement("a");
    a.className = "card";
    a.href = "view.html?scene=" + encodeURIComponent(e.path);
    a.innerHTML = `<img class="pixel" alt=""><h2></h2><p></p><div class="go">▶ PLAY</div>`;
    a.querySelector("img").src = e.path + "icon.svg";
    a.querySelector("h2").textContent = e.title;
    a.querySelector("p").textContent = e.desc;
    grid.appendChild(a);
  }
</script>
</body>
</html>
