<script src="../engine/engine.js"></script>
<script>
(() => {
'use strict';

// ---------- config ----------
const { W, H } = Engine;
const { num, CALM, SHORT } = Engine.params;
const BPM = num('bpm', 90, 60, 100);
const F0 = num('f0', 440, 220, 880);          // the probe's note in its own frame: the key of the track
const MASS = num('mass', 4.3e6, 5, 1e11);     // suns; Sgr A*, the black hole at the centre of our galaxy

// Schwarzschild: a clock hovering at radius r (in horizon radii RS) runs at k = sqrt(1 - RS/r) of a far-away one.
// From far away we hear its note at F0 k and its ticks k times as often. Every number drawn or played comes from k.
const GM_SUN = 1.32712e20, C = 2.99792458e8, G_EARTH = 9.80665;
const GM = GM_SUN * MASS, RS = 2 * GM / C ** 2;      // horizon radius, m
const SGR = MASS === 4.3e6, NAME = SGR ? 'SGR A*' : 'THE HOLE';
const rateAt = r => Math.sqrt(Math.max(0, 1 - 1 / r));
const rOfK = k => 1 / (1 - k * k);
const hoverG = r => GM / (r * RS) ** 2 / rateAt(r) / G_EARTH;   // thrust per kg to hover at r, in Earth g
const OCT_S = 2 * RS / C * Math.LN2;   // falling in, its note drops an octave about this often (late on)

// the stops: where the clock rate is a just interval, so the note the probe sings stays in the key
const STOPS = [[1, '1'], [8 / 9, '8/9'], [4 / 5, '4/5'], [2 / 3, '2/3'], [1 / 2, '1/2'], [1 / 4, '1/4']]
  .map(([k, frac]) => ({ k, frac, r: k === 1 ? Infinity : rOfK(k), f: F0 * k }));
const K_END = STOPS[5].k / 16;         // tether cut: 4 more octaves, into silence

const NOTES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const noteOf = f => { const m = Math.round(69 + 12 * Math.log2(f / 440)); return NOTES[(m % 12 + 12) % 12] + (Math.floor(m / 12) - 1); };
const letterOf = f => noteOf(f).replace(/-?\d+$/, '');
const KEY = letterOf(F0);


// the track: one section per stage, each introducing one layer
const SONG = [
  { id: 'title', bars: 2 },
  { id: 'far', bars: 8 },     // layer 1: drone pad
  { id: 'st1', bars: 8 },     // layer 2: the beacon (a pure sine + ticks) and pulse bells
  { id: 'st2', bars: 8 },     // layer 3: soft drums
  { id: 'st3', bars: 8 },     // layer 4: echo arp
  { id: 'build', bars: 4 },   // layer 5: triangle bass, and the probe sinks to half speed
  { id: 'drop', bars: 24 },   // everything: half time, the scale of gravity, quarter time
  { id: 'outro', bars: 4 },   // the tether is cut
];
const songClock = Engine.clock(BPM, SONG);   // not "clock": that draws the clock faces
const { STEP, BAR, BEAT, BAR_SEC, TOTAL_STEPS, LOOP, at, lb } = songClock;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const mod = s => ((s % TOTAL_STEPS) + TOTAL_STEPS) % TOTAL_STEPS;

// ---------- the probe's clock rate over the song, k(beat) ----------
// held at each stop, gliding between them evenly in pitch (log k), the same curve the sine's frequency ramp follows
const B0 = id => SONG.find(s => s.id === id).start * 4;      // where a section starts, in beats
const [S1, S2, S3, SB, SD, SO] = ['st1', 'st2', 'st3', 'build', 'drop', 'outro'].map(B0);
const SE = TOTAL_STEPS / 4;
const G_B = 12;     // the build's slide down to half speed, beats
function makeKeys(g3, gC) {
  const k = STOPS.map(s => s.k);
  return [[0, 1], [S1 + 8, 1], [S1 + 16, k[1]], [S2, k[1]], [S2 + 8, k[2]], [S3, k[2]], [S3 + g3, k[3]],
          [SB, k[3]], [SB + G_B, k[4]], [SD + 64 - gC, k[4]], [SD + 64, k[5]], [SO, k[5]], [SE, K_END]];
}
// probe time elapsed over a stretch where k goes k0 -> k1 evenly in log k (fraction u of length L)
const segTau = (k0, k1, L, u) => k0 === k1 ? k0 * L * u : k0 * L * ((k1 / k0) ** u - 1) / Math.log(k1 / k0);
function tauOn(keys, b) {
  let T = 0;
  for (let j = 0; j < keys.length - 1; j++) {
    const [a, k0] = keys[j], [c, k1] = keys[j + 1];
    if (b <= a) break;
    if (c > a) T += segTau(k0, k1, c - a, Math.min(1, (b - a) / (c - a)));
  }
  return T;
}
// glide lengths chosen so a whole number of probe beats passes from the beacon switching on to the drop,
// and from the drop to its quarter-time part: then its ticks land on our half notes, then on our bars
function fit(f, lo, hi, prefer) {
  const a = f(lo), b = f(hi), n0 = Math.ceil(Math.min(a, b)), n1 = Math.floor(Math.max(a, b));
  if (n0 > n1) return prefer;
  const N = clamp(Math.round(f(prefer)), n0, n1);
  for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2; if ((f(m) - N) * (a - N) > 0) lo = m; else hi = m; }
  return (lo + hi) / 2;
}
const G_3 = fit(g => { const ks = makeKeys(g, 8); return tauOn(ks, SD) - tauOn(ks, S1); }, 3, 24, 8);
const G_C = fit(g => { const ks = makeKeys(G_3, g); return tauOn(ks, SD + 64) - tauOn(ks, SD); }, 2, 14, 8);
const KEYS = makeKeys(G_3, G_C);
const TAUK = KEYS.map(([b]) => tauOn(KEYS, b));
function seg(b) { let j = 0; while (j < KEYS.length - 2 && b >= KEYS[j + 1][0]) j++; return j; }
function kAtB(b) {
  const j = seg(b), [a, k0] = KEYS[j], [c, k1] = KEYS[j + 1];
  return c > a ? k0 * (k1 / k0) ** clamp((b - a) / (c - a), 0, 1) : k1;
}
const kAt = ts => kAtB(ts / BEAT);              // the probe's clock rate at song time ts (s)
function tauAt(ts) {                            // the probe's clock at song time ts, in its own seconds
  const b = ts / BEAT, j = seg(b), [a, k0] = KEYS[j], [c, k1] = KEYS[j + 1];
  return (TAUK[j] + (c > a ? segTau(k0, k1, c - a, clamp((b - a) / (c - a), 0, 1)) : 0)) * BEAT;
}
const beaconOn = ts => ts >= S1 * BEAT;

// it ticks once per beat of its own time: when each tick reaches us
const TICKS = [];
{
  const end = tauAt(LOOP - 1e-6);
  for (let n = 0; S1 * BEAT + n * BEAT <= end; n++) {
    const T = S1 * BEAT + n * BEAT;
    let lo = 0, hi = LOOP;
    for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2; if (tauAt(m) < T) lo = m; else hi = m; }
    TICKS.push((lo + hi) / 2);
  }
}
const TICK_AT = new Map();
TICKS.forEach(tk => { const st = Math.floor(tk / STEP + 1e-6); if (!TICK_AT.has(st)) TICK_AT.set(st, []); TICK_AT.get(st).push(tk); });
const ticksIn = s => TICK_AT.get(mod(s)) || [];
function lastTick(ts) {
  let lo = 0, hi = TICKS.length - 1;
  if (!TICKS.length || ts < TICKS[0]) return null;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (TICKS[m] <= ts) lo = m; else hi = m - 1; }
  return TICKS[lo];
}

// ---------- the music, in just intonation on F0, so the probe's falling note locks to it ----------
const RATIO = { A: 1, B: 9 / 8, C: 6 / 5, D: 4 / 3, E: 3 / 2, F: 8 / 5, G: 16 / 9 };
// 'C5' -> Hz, with A4 = F0 and octaves counted from C as usual
const J = n => { const L = n[0], o = +n.slice(1); return F0 * RATIO[L] * 2 ** ((L === 'A' || L === 'B' ? o : o - 1) - 4); };
// Am G F Dm: drones low and shimmer high while the beacon sings in the middle; once it falls, the pad moves up
const CHORDS = [
  { low: ['A2', 'E3'], mid: ['A4', 'C5', 'E5'], hi: ['A5', 'C6', 'E6'], arp: ['E5', 'A5', 'C6'], bass: 'A1' },
  { low: ['G2', 'D3'], mid: ['B4', 'D5', 'G5'], hi: ['G5', 'B5', 'D6'], arp: ['D5', 'G5', 'B5'], bass: 'G1' },
  { low: ['F2', 'C3'], mid: ['A4', 'C5', 'F5'], hi: ['F5', 'A5', 'C6'], arp: ['C5', 'F5', 'A5'], bass: 'F1' },
  { low: ['D2', 'A2'], mid: ['A4', 'D5', 'F5'], hi: ['F5', 'A5', 'D6'], arp: ['D5', 'F5', 'A5'], bass: 'D2' },
];
const ARPI = [0, 1, 2, 3, 4, 3, 2, 1, 0, 1, 2, 3, 5, 4, 3, 1];
const arpTone = (ch, k) => J(CHORDS[ch].arp[k % 3]) * 2 ** Math.floor(k / 3);
const HATV = [0.5, 0.15, 0.3, 0.15, 0.45, 0.15, 0.3, 0.2, 0.5, 0.15, 0.3, 0.15, 0.45, 0.2, 0.3, 0.25];
// the probe's own song, 2 bars of its time: we hear it at half, then quarter, tempo and pitch
const MOTIF = Array.from({ length: 32 }, (_, i) => ({ 0: 'E6', 3: 'C6', 6: 'A5', 8: 'D6', 11: 'B5', 14: 'G5',
  16: 'C6', 19: 'A5', 22: 'F5', 24: 'F5', 26: 'A5', 28: 'D6', 30: 'E6' })[i] || 0);
const SD_S = SD * 4, GC_S = Math.ceil((SD + 64 - G_C) * 4), SC_S = (SD + 64) * 4, SO_S = SO * 4, S1_S = S1 * 4;

// the silent beats: only the probe sounds in them
function hushAt(s) {
  const { id, lb, i } = at(s);
  return i >= 12 && ((id === 'build' && lb === 3) || (id === 'drop' && lb === 15));
}
// one chord a bar; one per two bars once the probe's time runs at a quarter
function chordAt(s) {
  const { id, lb } = at(s);
  if (id === 'outro') return 0;
  return id === 'drop' && lb >= 16 ? ((lb - 16) >> 1) % 4 : lb % 4;
}
// the probe's song on step s (its local steps land on ours while its rate holds at 1/2 or 1/4)
function probeNote(s) {
  s = mod(s);
  let base, mult, end;
  if (s >= SD_S && s < GC_S) { base = SD_S; mult = 2; end = GC_S; }
  else if (s >= SC_S && s < SO_S) { base = SC_S; mult = 4; end = SO_S; }
  else return null;
  const d = s - base;
  if (d % mult) return null;
  const n = d / mult, m = MOTIF[n % 32];
  if (!m) return null;
  let j = 1;
  while (j < 32 && !MOTIF[(n + j) % 32]) j++;

}

// single source of truth for what plays on step s: audio, HUD and visuals all read this
function hit(layer, s) {
  const { id, lb, i } = at(s), hush = hushAt(s), D = id === 'drop', Q = D && lb >= 16;
  const st = id === 'st1' || id === 'st2' || id === 'st3';
  switch (layer) {
    case 'pad':   // chord number + 1 where a pad chord starts
      if (id === 'title' || hush) return 0;
      if (id === 'outro') return lb === 0 && i === 0 ? 1 : 0;
      if (Q) return lb % 2 === 0 && i === 0 ? chordAt(s) + 1 : 0;
      return i === 0 ? chordAt(s) + 1 : 0;
    case 'bell':  // chord tone + 1
      if (hush || !(st || id === 'build' || D || id === 'outro')) return 0;
      if (id === 'outro') return lb < 2 && i === 0 ? 1 : 0;
      if (id === 'st1' && lb < 2) return i === 0 ? 1 : 0;
      if (Q) return (lb % 2 === 0 ? { 0: 1, 10: 2 } : { 4: 3 })[i] || 0;
      return ({ 0: 1, 6: 2, 10: 3, 14: D ? 2 : 0 })[i] || 0;
    case 'kick':
      if (hush) return 0;
      if (id === 'st2') return i === 0 ? 0.7 : i === 10 && lb >= 4 ? 0.45 : 0;
      if (id === 'st3') return i === 0 ? 0.7 : i === 10 ? 0.45 : 0;
      if (id === 'build') return lb < 2 ? (i === 0 ? 0.7 : i === 10 ? 0.45 : 0) : lb === 2 ? (i % 4 === 0 ? 0.6 : 0) : (i % 2 === 0 ? 0.35 + 0.04 * i : 0);
      if (Q) return lb % 2 === 0 ? (i === 0 ? 1 : 0) : (i === 10 ? 0.45 : 0);
      if (D) return i === 0 ? 1 : i === 14 && lb % 2 ? 0.4 : 0;
      return 0;
    case 'snare':
      if (hush) return 0;
      if (Q) return lb % 2 === 1 && i === 0 ? 1 : 0;
      if (D) return i === 8 ? 1 : i === 15 && lb % 4 === 3 ? 0.3 : 0;
      if (id === 'build' && lb === 3) return i % 2 === 1 ? 0.15 + 0.04 * i : 0;
      return 0;
    case 'hat':
      if (hush) return 0;
      if (id === 'st2') return lb < 4 ? (i % 4 === 2 ? 0.5 : 0) : (i % 2 === 0 ? HATV[i] : 0);
      if (id === 'st3' || (id === 'build' && lb < 3) || Q) return i % 2 === 0 ? HATV[i] : 0;
      if (D) return HATV[i];
      return 0;
    case 'arp':
      if (hush) return 0;
      if (id === 'st3') return lb < 4 && i % 2 ? 0 : arpTone(chordAt(s), ARPI[i]);
      if (id === 'build' || (D && !Q)) return arpTone(chordAt(s), ARPI[i]);
      if (Q) return i % 2 ? 0 : arpTone(chordAt(s), ARPI[i]);
      return 0;
    case 'bass':
      if (hush) return 0;
      if (id === 'build') return i === 0 ? 1 : 0;
      if (Q) return lb % 2 === 0 && i === 0 ? 1 : 0;
      if (D) return i === 0 || i === 10 ? 1 : 0;
      return 0;
    case 'probe': return probeNote(s) ? 1 : 0;
    case 'tick': return ticksIn(s).length ? 1 : 0;
    case 'crash': return i === 0 && D && lb % 8 === 0 ? 1 : 0;
    case 'drm': return hit('kick', s) || hit('snare', s);
    case 'perc': return hit('kick', s) || hit('snare', s) || hit('hat', s);

const { since, pulse, last } = Engine.envelopes(hit, songClock);

// a bed note is kept only if it stays at least a fifth from the beacon for as long as it sounds,
// so nothing in the chip bed can mask the teaching tone
function clear(f, t0, t1) {
  for (let j = 0; j <= 12; j++) {
    const ts = (t0 + (t1 - t0) * j / 12) % LOOP;
    if (!beaconOn(ts)) continue;
    const fb = F0 * kAt(ts), r = f > fb ? f / fb : fb / f;
    if (r < 1.5 - 1e-9) return false;
  }
  return true;
}
function holdFor(layer, s, max) {
  let n = 1;
  while (n < max && !hit(layer, s + n) && !hushAt(s + n)) n++;
  return n * STEP;
}
// every pitched note of the chip bed on step s (and any left out for crowding the beacon)
const PAD_TAIL = 0.7;
function bedNotes(s) {
  const out = [], dropped = [], { id, lb, i } = at(s), ch = CHORDS[chordAt(s)], D = id === 'drop', ts = mod(s) * STEP;
  const add = (v, f, dur, vol, extra = {}) => (clear(f, ts, ts + dur) ? out : dropped).push({ v, f, dur, vol, ...extra });
  if (hit('pad', s)) {
    const dur = holdFor('pad', s, 64) + PAD_TAIL;

  }

// one colour per actor, kept all the way through
const P = {
  bg: '#04050f', grid: '#0e1330', edge: '#2a3166', dim: '#8a90c8', fg: '#eef0ff', shadow: '#000000', white: '#ffffff', black: '#000000',
  beacon: '#5ff0ff', beaconD: '#12505a', beaconL: '#c8fbff',   // the probe: its note, its clock, its label
  hole: '#ff9a3c', holeD: '#4a2208', holeL: '#ffd9a8',          // the glow round the hole
  pad: '#a98bff', padD: '#35295e',
  bell: '#ff9ad5', bellD: '#55223f',
  drm: '#ff7a5a', drmD: '#56241a',
  arp: '#4f7bff', arpD: '#1a2766',
  bass: '#4dffa0', bassD: '#145a36',
  curve: '#ffd23f', curveD: '#5e4a10',
};
// the probe's light as we see it: it leaves at 490 nm (cyan) and reaches us at 490 / k
const SPEC = [[500, '#5ff0ff', 'CYAN'], [565, '#7dff7a', 'GREEN'], [590, '#ffe34a', 'YELLOW'], [625, '#ff9a3c', 'ORANGE'],
              [700, '#ff4a3a', 'RED'], [780, '#a01c2c', 'DEEP RED'], [Infinity, '#4a1430', 'INFRARED']];
const LAM0 = 490;
const specOf = nm => SPEC.find(([m]) => nm < m);
const lightCol = k => specOf(LAM0 / k)[1];
const lightName = k => specOf(LAM0 / k)[2];

// ---------- canvas + gfx helpers ----------
const { cx, textW, text, card, bay, fillCircle, ditherCircle, line, ditherFill } = Engine.gfx(P);
const { mulberry } = Engine.rand;

// thin dithered ring, sampled by angle; only the arc between a0 and a1 (radians)
function ring(x, y, r, col, th, d, a0 = 0, a1 = 2 * Math.PI) {
  if (d <= 0 || r < 1) return;
  cx.fillStyle = col;
  const lvl = d * 16, n = Math.ceil(r * 7 * (a1 - a0) / 6.283) + 8;
  for (let k = 0; k < n; k++) {
    const a = a0 + k / n * (a1 - a0), c = Math.cos(a), s = Math.sin(a);
    for (let j = 0; j < th; j++) {
      const px = Math.round(x + c * (r + j)), py = Math.round(y + s * (r + j));
      if (px >= 0 && px < W && py >= 0 && py < H && bay(px, py) < lvl) cx.fillRect(px, py, 1, 1);
    }

function dot(px, py, col, d) {
  px = Math.round(px); py = Math.round(py);
  if (px < 0 || px >= W || py < 0 || py >= H) return;
  if (bay(px, py) < d * 16) { cx.fillStyle = col; cx.fillRect(px, py, 1, 1); }
}

const rng = mulberry(1915);

// background stars, bent outward round a hole: lens = [[x, y, strength px^2, shadow px], ...]
const STARS = Array.from({ length: 140 }, () => ({ x: rng() * W, y: rng() * H, b: rng() }));
function stars(t, lens = []) {
  STARS.forEach((s, k) => {
    let x = s.x, y = s.y;
    for (const [hx, hy, e2, rh] of lens) {
      const dx = x - hx, dy = y - hy, d2 = dx * dx + dy * dy;
      if (d2 < (rh + 1) ** 2) return;
      x += dx * e2 / d2; y += dy * e2 / d2;
    }

// ---------- text helpers ----------
const { fmtNum, fmtBig } = Engine.fmt;
const rough = v => { const e = Math.pow(10, Math.floor(Math.log10(v)) - 1); return fmtBig(Math.round(v / e) * e); }; // 2 significant figures
const fmtHz = f => f >= 100 ? String(Math.round(f)) : f >= 10 ? f.toFixed(1) : f.toFixed(2);
const fmtR = r => r < 1.01 ? r.toFixed(4) : r.toFixed(2);

const stopLine = st => `AT ${fmtR(st.r)} RS: ${fmtHz(st.f)} HZ (${letterOf(st.f)})`;

const fact = (lines, border) => card(lines.map(l => typeof l === 'string' ? { t: l } : l), 200, 90, border);
const timeline = s => { const w = textW(s.toUpperCase(), 1); cx.fillStyle = P.bg; cx.fillRect(88 - Math.round(w / 2), 242, w + 4, 9); text(s, 90, 244, P.dim, 1, 'c'); };

// ---------- audio (everything synthesised) ----------
const { ctx, track, G, F, chain, pan, osc, env, play, noise, noiseSource } = Engine.audio;
let master, secGain, comp, duck, kickIn, bassIn, padIn, bellIn, arpIn, probeIn, percIn, fxSend, spaceSend, pureIn;

// every node made while one step is being scheduled; all are disconnected once that step's last sound ends
// (Chrome tidies finished notes up by itself, Safari keeps processing them and slows to a crawl)

function buildGraph(ac, out) {

  // ping-pong echo, dotted eighth, each side darker than the last

// layer 1: two detuned 50% pulses per note, slow swell, into the echo and the space

// ---------- visual envelopes, read from the same hit() table ----------
const smooth = x => x * x * (3 - 2 * x);

function tickGlow(ts, k) {
  const tk = lastTick(ts);

// ---------- the actors ----------
// a black hole as you'd see it: its shadow, a thin bright ring, brighter on the side swinging toward us
function shadow(x, y, R, e = 0) {
  ditherCircle(x, y, R, Math.round(R * 1.7), P.holeD, 0.45 + 0.2 * e);
  ditherCircle(x, y, R, R + 3, P.hole, 0.5 + 0.3 * e);

const HTOP = 164;

function station(x, y, t) {
  cx.fillStyle = P.edge; cx.fillRect(x - 10, y + 1, 21, 2);
  cx.fillStyle = P.dim; cx.fillRect(x - 3, y - 1, 7, 5);
  cx.fillStyle = (t % BEAT) < 0.12 ? P.white : P.fg; cx.fillRect(x - 10, y + 1, 1, 1); cx.fillRect(x + 10, y + 1, 1, 1);
}

function side(t, o = {}) {
  const rp = o.rp || 12, hy = HTOP + rp, k = kAt(t), r = rOfK(k);

  text(v.r === Infinity ? 'AT STATION' : `R=${fmtR(v.r)} RS`, v.px - 8, v.py, P.dim, 1, 'r');

    if (on) card([{ t: 'TAP TO START', c: P.beacon, s: 2 }], 222);
    text('HEADPHONES + VOLUME UP', 90, 250, P.edge, 1, 'c');
  } else if (on) card([{ t: 'LISTEN TO TIME SLOW DOWN', c: P.beacon }], 222);
}

function sceneFar(lt, t, sec) {
  const bar = lb(lt);
  if (bar < 4) {
    const R = 30, y = 112;
    stars(t, [[90, y, R * R * 1.4, R]]);
    shadow(90, y, R, 1 - Math.min(1, since('pad', t) / 2));
    text(NAME, 90, y + R + 16, P.hole, 1, 'c');
    banner(`1. ${NAME}`, 'LAYER 1: DRONE PAD', P.pad);
    fact(bar < 2 ? [`${fmtBig(MASS)} SUNS OF MASS`, { t: `HORIZON ${rough(2 * RS / 1000)} KM ACROSS`, c: P.hole }, { t: SGR ? 'AT THE HEART OF OUR GALAXY' : 'A BLACK HOLE', c: P.dim }]
                 : ['MASS BENDS SPACE AND TIME', { t: 'CLOSE TO IT, CLOCKS RUN SLOW', c: P.hole }, { t: 'EINSTEIN, 1915', c: P.dim }], P.pad);
    timeline('THE BLACK DISC IS ITS SHADOW');
    return;
  }
  const v = side(t);
  clock(22, 60, 7, t / BAR, P.fg, 'US');
  probeLabels(v, t);
  const w = lt - 4 * BAR;
  if (w < 0.3) ditherFill(P.bg, 1 - w / 0.3);
  banner('1. THE PLAN', 'LAYER 1: DRONE PAD', P.pad);
  fact(['OUR STATION HOVERS FAR AWAY', { t: 'WE LOWER A PROBE ON A TETHER', c: P.beacon }, { t: 'IT TICKS A CLOCK AND SINGS A NOTE', c: P.dim }], P.pad);
  timeline('SIDE VIEW. RS = HORIZON RADIUS');
}

function sceneStop(lt, t, n) {
  const bar = lb(lt), v = side(t, { ps: n === 3 }), st = STOPS[n], col = [0, P.beacon, P.drm, P.arp][n];
  if (n === 3) climbWaves(v, t);
  tape(t, 34);
  clock(22, 60, 7, t / BAR, P.fg, 'US');
  probeLabels(v, t);
  if (n === 1) {
    banner('2. THE BEACON', 'LAYER 2: BEACON + PULSE BELLS', col);
    fact(bar < 2 ? [`AT THE STATION: ${fmtHz(F0)} HZ (${KEY})`, { t: '1 TICK PER BEAT, SAME AS OURS', c: col }, { t: 'TWO CLOCKS, IN STEP', c: P.dim }]
       : bar < 4 ? ['LOWERING IT ON THE TETHER...', { t: `DOWN TO ${fmtR(st.r)} RS`, c: col }, { t: 'WATCH ITS CLOCK, HEAR ITS NOTE', c: P.dim }]
       : [stopLine(st), { t: `ITS CLOCK RUNS AT ${st.frac} OF OURS`, c: col }, { t: `1 TICK EVERY ${st.frac.split('/').reverse().join('/')} OF OUR BEATS`, c: P.dim }], col);
    timeline('NOT TO SCALE');
  } else if (n === 2) {
    banner('3. DEEPER', 'LAYER 3: SOFT DRUMS', col);
    fact(bar < 4 ? [stopLine(st), { t: `ITS CLOCK RUNS AT ${st.frac} OF OURS`, c: col }, { t: 'ITS TICKS DRIFT OFF OUR DRUMS', c: P.dim }]
                 : ['NOTHING IS WRONG WITH ITS CLOCK', { t: 'TIME ITSELF RUNS SLOWER THERE', c: col }, { t: 'ON BOARD, ALL FEELS NORMAL', c: P.dim }], col);
    timeline('TOP: OUR BEATS. BELOW: ITS TICKS');
  } else {
    banner('4. REDSHIFT', 'LAYER 4: ECHO ARP', col);
    fact(bar < 4 ? [`DOWN TO ${fmtR(st.r)} RS: ${fmtHz(st.f)} HZ (${letterOf(st.f)})`, { t: 'ITS LIGHT STRETCHES AS IT CLIMBS', c: col }, { t: `CYAN LEAVES IT, ${lightName(st.k)} REACHES US`, c: P.dim }]
                 : ['PHOTON SPHERE: 1.5 RS', { t: 'THERE, LIGHT CAN ORBIT THE HOLE', c: col }, { t: `ITS CLOCK: ${st.frac} OF OURS`, c: P.dim }], col);
    timeline('SCHEMATIC: WAVES SLOWED FOR DISPLAY');
  }
}

function sceneBuild(lt, t, sec) {
  const s = Math.floor(t / STEP), v = side(t, { ps: true }), st = STOPS[4];
  tape(t, 34);
  clock(22, 60, 7, t / BAR, P.fg, 'US');
  probeLabels(v, t);
  if (hushAt(s)) {
    ditherFill(P.bg, 0.5);
    probe(v.px, v.py, v.k, t);
    card([{ t: '1 OCTAVE DOWN', s: 2, c: P.beacon }, { t: 'ITS CLOCK: HALF OUR SPEED', c: P.beaconL }], 96);
  }
  banner('5. HALF SPEED', 'LAYER 5: TRIANGLE BASS', P.bass);
  fact([`DOWN TO ${fmtR(st.r)} RS (4/3 RS)`, { t: 'ITS CLOCK FALLS TO HALF SPEED', c: P.bass }, { t: `ITS NOTE: ${fmtHz(st.f)} HZ, 1 OCTAVE DOWN`, c: P.dim }], P.bass);
  timeline('PHOTON SPHERE DOTTED. NOT TO SCALE');
}

// --- the drop: three 8-bar parts ---
function dropHalf(plt, t, s, e8, col) {
  const v = side(t), st = STOPS[4], ke = pulse('kick', t, 3);
  ring(90, v.hy, v.rp + 3 + Math.round(since('kick', t) * 30), P.hole, 1, 0.5 * ke);
  notesUp(v, t, s);
  bigClocks(t, v.k);
  probeLabels(v, t, false);
  text(lightName(v.k), v.px + 8, v.py - 2, P.bell);
  return { title: '6. HALF TIME',
    lines: e8 < 4 ? [`AT ${fmtR(st.r)} RS: ${fmtHz(st.f)} HZ, 1 OCTAVE DOWN`, { t: '1 OF ITS SECONDS = 2 OF OURS', c: col }, { t: 'ITS SONG: HALF TEMPO, OCTAVE DOWN', c: P.dim }]
                  : ['1 HOUR THERE = 2 HOURS HERE', { t: 'STAY A YEAR, THEN COME BACK UP:', c: col }, { t: '2 YEARS HAVE PASSED OUT HERE', c: P.dim }],
    time: 'SCHEMATIC. NOT TO SCALE' };
}

function dropScale(plt, t, s, e8, col) {
  stars(t);
  const gx = r => Math.round(20 + Math.log(r) / Math.log(6) * 140), gy = k => Math.round(150 - k * 100);
  line(20, 44, 20, 150, P.edge); line(20, 150, 172, 150, P.edge);
  text('CLOCK RATE', 22, 38, P.dim);
  for (const r of [1, 2, 4, 6]) text(String(r), gx(r), 154, P.dim, 1, 'c');
  text('R/RS', 172, 154, P.dim, 1, 'r');
  for (const kk of [1, 0.5, 0.25]) { text(fmtHz(F0 * kk), 17, gy(kk) - 2, P.dim, 1, 'r'); line(21, gy(kk), 172, gy(kk), P.grid, 0.4); }
  text('HZ', 17, 140, P.dim, 1, 'r');
  // the curve, drawing itself over the first bar: rate = (1 - RS/r)^1/2
  const reveal = clamp(plt / BAR, 0, 1);
  for (let x = 20; x <= 20 + 148 * reveal; x += 0.5) { const r = 6 ** ((x - 20) / 140); dot(x, gy(rateAt(r)), P.curve, 1); }
  text('HORIZON', 23, 141, P.hole);
  // every stop, with its note
  STOPS.forEach(st => {
    const x = st.r === Infinity ? 168 : gx(st.r), y = gy(st.k);
    fillCircle(x, y, 1, P.beacon);
    text(letterOf(st.f), x, y - 8, P.beaconL, 1, 'c');
    text(st.frac, x, y + 4, P.dim, 1, 'c');
  });
  text('FAR', 168, 30 + 34, P.dim, 1, 'c');
  // where the probe is now
  const k = kAt(t), r = rOfK(k), x = gx(r), y = gy(k), e = tickGlow(t, k);
  ditherCircle(x, y, 0, 3 + Math.round(3 * e), lightCol(k), 0.5 + 0.4 * e);
  cx.fillStyle = P.white; cx.fillRect(x, y, 1, 1);
  return { title: '7. THE SCALE',
    lines: e8 < 4 ? [`EVERY STOP WAS A NOTE IN ${KEY} MINOR`, { t: 'CLOCK RATES 1, 8/9, 4/5, 2/3, 1/2', c: col }, { t: `NOTES ${STOPS.slice(0, 5).map(st => letterOf(st.f)).join(', ')}`, c: P.dim }]
                  : ['AT THE HORIZON THE RATE HITS 0', { t: 'NEXT STOP: 1/4, 2 OCTAVES DOWN', c: col }, { t: 'RATE = (1 - RS/R)^1/2', c: P.dim }],
    time: 'CLOCK RATES SEEN FROM FAR AWAY' };
}

function dropQuarter(plt, t, s, e8, col) {
  const rp = Math.round(12 + 24 * smooth(clamp(plt / BAR, 0, 1))), v = side(t, { rp, ps: true }), st = STOPS[5], ke = pulse('kick', t, 3);
  ring(90, v.hy, v.rp + 3 + Math.round(since('kick', t) * 30), P.hole, 1, 0.5 * ke);
  notesUp(v, t, s);
  bigClocks(t, v.k);
  probeLabels(v, t, false);
  text(lightName(v.k), v.px + 8, v.py - 2, P.bell);
  return { title: '8. QUARTER TIME',
    lines: e8 < 4 ? [`AT ${fmtR(st.r)} RS: ${fmtHz(st.f)} HZ, 2 OCTAVES DOWN`, { t: '1 HOUR THERE = 4 HOURS HERE', c: col }, { t: 'ITS SONG: QUARTER TEMPO', c: P.dim }]
                  : ['TO HOVER THIS CLOSE IT WOULD', { t: `NEED ${rough(hoverG(st.r))} G OF THRUST`, c: col }, { t: 'NO REAL PROBE COULD', c: P.dim }],
    time: 'ZOOMED IN. NOT TO SCALE' };
}

const DROP_PARTS = [dropHalf, dropScale, dropQuarter];
function sceneDrop(lt, t, sec) {
  const bar = lb(lt), part = bar >> 3, e8 = bar % 8, s = Math.floor(t / STEP), col = [P.beacon, P.curve, P.bass][part];
  const r = DROP_PARTS[part](lt - part * 8 * BAR, t, s, e8, col);
  if (hushAt(s)) {
    ditherFill(P.bg, 0.5);
    card([{ t: '2 OCTAVES DOWN', s: 2, c: P.beacon }, { t: 'ITS CLOCK: 1/4 OF OUR SPEED', c: P.beaconL }], 96);
  }
  banner(r.title, 'ALL LAYERS: THE DROP', col, col);
  fact(r.lines, col);
  timeline(r.time);
}

function sceneOutro(lt, t, sec) {
  const bar = lb(lt), k = kAt(t), fade = Math.min(1, Math.sqrt(k / STOPS[5].k));
  const v = side(t, { rp: 36, ps: true, cut: true, fade });
  line(90, 0, 90, Math.max(0, Math.round(v.py - 6 - lt * 50)), P.edge);   // the cut tether, reeled in
  probeLabels(v, t, false);
  if (bar === 0) text('TETHER CUT', 90, 60, P.dim, 1, 'c');
  banner('9. LET GO', 'THE PAD ALONE', P.pad);
  fact(bar < 2 ? ['THE TETHER IS CUT. IT FALLS IN', { t: 'FROM HERE IT SLOWS, REDDENS, DIMS', c: P.beacon }, { t: 'AND NEVER QUITE CROSSES', c: P.dim }]
               : ['SIZES NOT TO SCALE. WAVES SLOWED', { t: `REALLY: 1 OCTAVE DOWN EVERY ${fmtS(OCT_S)}`, c: P.pad }, { t: 'NO PROBE COULD HOVER THAT CLOSE', c: P.dim }], P.pad);
  timeline(`SCHEMATIC. FADE ${OCT_S > BAR ? 'SPED UP' : 'SLOWED'}`);
}

const SCENES = { far: sceneFar, st1: (lt, t) => sceneStop(lt, t, 1), st2: (lt, t) => sceneStop(lt, t, 2), st3: (lt, t) => sceneStop(lt, t, 3),
                 build: sceneBuild, drop: sceneDrop, outro: sceneOutro };

// ---------- one frame at song time tau; the engine's main loop calls it ----------
function draw(tau) {
  const t = tau % LOOP;
  const bar = Math.floor(t / BAR), sec = SONG[BAR_SEC[bar]], lt = t - sec.start * BAR;
  cx.setTransform(1, 0, 0, 1, 0, 0);
  cx.fillStyle = P.bg; cx.fillRect(0, 0, W, H);
  if (sec.id === 'title') sceneTitle(lt, t, { started: true });
  else SCENES[sec.id](lt, t, sec);
  if (sec.id !== 'title') { meter(t); hud(t); }
  if (lt < 0.3 && sec.k > 0) ditherFill(P.bg, 1 - lt / 0.3);
  const pl = lt % (8 * BAR);
  if (sec.id === 'drop' && !CALM && pl < 0.4) ditherFill(P.white, 0.35 * (1 - pl / 0.4));
}

const { levels } = Engine.run({
  clock: songClock, buildGraph, voices, draw,
  title: sceneTitle,
  paused: P.beacon,
  thumb: SONG.find(s => s.id === 'drop').start * BAR + 2 * BAR + 6 * STEP,   // two bars into the drop, between kicks (no flash)
});
// offline render for checking levels without ears: __render(fromBar, bars, only) -> per-bar peak/rms.
// only = 'pure' renders just the beacon, 'bed' everything else
window.__render = (bar0, bars, only, sr = 22050) => levels(bar0, bars, sr, () => {
  if (only === 'pure') secGain.disconnect();
  if (only === 'bed') pureIn.disconnect();
  const ts0 = bar0 * BAR;
  if (ts0 > S1 * BEAT) beaconTone(0.05, ts0);
});
})();
</script>
